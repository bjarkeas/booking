<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udstyr Booking — OB Pulje</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14161b;
    --panel:#1c1f26;
    --panel-2:#23262e;
    --border:#2e323c;
    --text:#e9eaee;
    --muted:#8b8f9c;
    --amber:#e8a33d;
    --amber-dim:#5c4521;
    --green:#5fb88a;
    --red:#e2685f;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber-dim); }
  .app{ max-width:1100px; margin:0 auto; padding:20px 18px 60px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0 18px; border-bottom:1px solid var(--border); margin-bottom:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .brand h1{ font-size:16px; letter-spacing:.06em; text-transform:uppercase; margin:0; font-weight:700; }
  .brand .sub{ font-size:11px; color:var(--muted); font-family:var(--mono); letter-spacing:.04em; }

  .btn{
    background:var(--amber); color:#1a1407; border:none; font-weight:700;
    padding:10px 16px; border-radius:7px; cursor:pointer; font-size:13px;
    transition:filter .15s ease; letter-spacing:.01em;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .btn.secondary:hover{ filter:brightness(1.15); }
  .btn.danger{ background:transparent; color:var(--red); border:1px solid #4a2c2a; }
  .btn.danger:hover{ background:#2a1a18; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.small{ padding:6px 11px; font-size:12px; border-radius:6px; }

  nav.tabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); }
  nav.tabs button{
    background:none; border:none; color:var(--muted); padding:10px 4px; margin-right:18px;
    font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
    letter-spacing:.02em;
  }
  nav.tabs button.active{ color:var(--amber); border-bottom-color:var(--amber); }

  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty .big{ font-size:30px; margin-bottom:8px; }

  /* Job list */
  .job-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    margin-bottom:10px; overflow:hidden;
  }
  .job-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    cursor:pointer; gap:12px;
  }
  .job-head:hover{ background:var(--panel-2); }
  .job-title{ font-weight:700; font-size:14.5px; }
  .job-meta{ font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:3px; }
  .job-count{
    font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--panel-2);
    border:1px solid var(--border); padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .job-conflict-badge{
    font-family:var(--mono); font-size:11px; color:var(--red); background:#2a1a18;
    border:1px solid #4a2c2a; padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .job-body{ border-top:1px solid var(--border); padding:14px 16px; display:none; }
  .job-body.open{ display:block; }
  .job-body .notes{ font-size:12.5px; color:var(--muted); margin-bottom:10px; white-space:pre-wrap;}
  .item-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px solid #25282f; font-size:13px;
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row .cat{ font-size:10px; color:var(--muted); font-family:var(--mono); }
  .item-qty{ font-family:var(--mono); color:var(--amber); font-weight:700; min-width:34px; text-align:right; }
  .job-actions{ display:flex; gap:8px; margin-top:14px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    width:100%; max-width:760px; padding:22px; margin-bottom:30px;
  }
  .modal h2{ margin:0 0 16px; font-size:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 10px; border-radius:7px; font-size:13.5px; font-family:var(--sans);
  }
  .field textarea{ resize:vertical; min-height:50px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .equip-picker{ border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-top:4px; }
  .equip-search{ padding:10px; border-bottom:1px solid var(--border); background:var(--panel-2); }
  .equip-search input{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; }
  .equip-list{ max-height:260px; overflow-y:auto; }
  .equip-cat{ font-size:10.5px; color:var(--muted); font-family:var(--mono); letter-spacing:.05em; padding:8px 12px 4px; text-transform:uppercase; }
  .equip-item{ display:flex; align-items:center; gap:10px; padding:7px 12px; font-size:13px; }
  .equip-item:hover{ background:var(--panel-2); }
  .equip-item input[type=checkbox]{ accent-color:var(--amber); width:15px; height:15px; flex-shrink:0; }
  .equip-item .name{ flex:1; }
  .equip-item .stock{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .equip-item .qty-input{
    width:48px; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:5px; padding:3px 4px; text-align:center; font-family:var(--mono); font-size:12px;
  }
  .equip-item.warn{ background:#241a16; }
  .equip-item .warn-text{ color:var(--red); font-size:10.5px; font-family:var(--mono); }

  .selected-strip{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{
    background:var(--amber-dim); color:var(--amber); border-radius:20px; padding:4px 10px;
    font-size:11.5px; font-family:var(--mono); display:flex; align-items:center; gap:6px;
  }
  .chip button{ background:none; border:none; color:var(--amber); cursor:pointer; font-size:13px; line-height:1; padding:0; }

  .conflict-box{
    background:#241a16; border:1px solid #4a2c2a; border-radius:8px; padding:10px 12px;
    font-size:12px; color:#f0a399; margin-top:12px; font-family:var(--mono); line-height:1.6;
  }
  .conflict-box .ok{ color:var(--green); }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }

  /* Availability tab */
  .avail-result{ margin-top:16px; }
  .avail-row{
    display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
    border-bottom:1px solid #25282f; font-size:13px;
  }
  .avail-row:last-child{ border-bottom:none; }
  .avail-free{ font-family:var(--mono); font-weight:700; }
  .avail-free.ok{ color:var(--green); }
  .avail-free.bad{ color:var(--red); }
  .avail-used-by{ font-size:11px; color:var(--muted); margin-top:2px; }

  .loading{ text-align:center; padding:40px; color:var(--muted); font-family:var(--mono); font-size:12px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#33363f; border-radius:10px; }

  @media (max-width:640px){
    .row2, .row3{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>Udstyr Booking</h1>
        <div class="sub">OB PULJE &middot; DELT LAGER</div>
      </div>
    </div>
    <button class="btn" id="newJobBtn">+ Nyt job</button>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="jobs">Bookinger</button>
    <button data-tab="avail">Tjek ledighed</button>
    <button data-tab="lager">Lager</button>
  </nav>

  <div id="tab-jobs">
    <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:12px 14px;">
      <div class="field" style="margin:0;">
        <label>Vis jobs fra</label>
        <input type="date" id="filterStart" style="background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px;">
      </div>
      <div class="field" style="margin:0;">
        <label>til</label>
        <input type="date" id="filterEnd" style="background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px;">
      </div>
      <button class="btn small secondary" id="filterResetBtn" style="margin-bottom:1px;">Nulstil</button>
      <div id="filterCount" style="font-size:11px; color:var(--muted); font-family:var(--mono); align-self:center; margin-left:4px;"></div>
    </div>
    <div id="jobsLoading" class="loading">Henter bookinger...</div>
    <div id="jobsList"></div>
  </div>

  <div id="tab-avail" style="display:none;">
    <div class="panel">
      <div class="row3">
        <div class="field">
          <label>Udstyr</label>
          <input type="text" id="availSearch" placeholder="Søg udstyr...">
        </div>
        <div class="field">
          <label>Start dato</label>
          <input type="date" id="availStart">
        </div>
        <div class="field">
          <label>Slut dato</label>
          <input type="date" id="availEnd">
        </div>
      </div>
      <div id="availMatches" style="display:none;"></div>
      <div id="availResult" class="avail-result"></div>
    </div>
  </div>

  <div id="tab-lager" style="display:none;">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
        <input type="text" id="lagerSearch" placeholder="Søg i lager..." style="flex:1; min-width:200px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13.5px;">
        <button class="btn small" id="addEquipBtn">+ Tilføj udstyr</button>
        <button class="btn small secondary" id="showStatsBtn">📊 Statistik</button>
      </div>
      <div id="lagerNewRow" style="display:none; margin-bottom:14px;"></div>
      <div id="lagerCount" style="font-size:11px; color:var(--muted); font-family:var(--mono); margin-bottom:8px;"></div>
      <div id="lagerList"></div>
    </div>
  </div>

  <div id="tab-stats" style="display:none;">
    <div class="panel" style="margin-bottom:14px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
        <div class="field" style="margin:0; min-width:120px;">
          <label>År</label>
          <select id="statsYear" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;"></select>
        </div>
        <div class="field" style="margin:0; min-width:180px;">
          <label>Kategori</label>
          <select id="statsCat" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;">
            <option value="">Alle kategorier</option>
          </select>
        </div>
        <div class="field" style="margin:0; min-width:160px;">
          <label>Sorter efter</label>
          <select id="statsSort" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;">
            <option value="total">Mest brugt i alt</option>
            <option value="name">Navn (A-Z)</option>
            <option value="peak">Højeste enkelt måned</option>
          </select>
        </div>
        <div class="field" style="margin:0; min-width:160px;">
          <label>Vis</label>
          <select id="statsMetric" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;">
            <option value="days">Dage booket</option>
            <option value="jobs">Antal jobs</option>
          </select>
        </div>
        <button class="btn small secondary" id="statsExportBtn">⬇ Eksportér CSV</button>
        <button class="btn small secondary" id="statsCloseBtn">✕ Luk statistik</button>
      </div>
    </div>
    <div id="statsSummary" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;"></div>
    <div id="statsContent" class="loading">Beregner statistik...</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nyt job</h2>
    <input type="hidden" id="editJobId">

    <div class="row2">
      <div class="field">
        <label>Job navn</label>
        <input type="text" id="jobName" placeholder="f.eks. VM Fodbold">
      </div>
      <div class="field">
        <label>Hvem (initialer)</label>
        <input type="text" id="jobWho" placeholder="f.eks. JAKV">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Start dato</label>
        <input type="date" id="jobStart">
      </div>
      <div class="field">
        <label>Slut dato</label>
        <input type="date" id="jobEnd">
      </div>
    </div>
    <div class="field">
      <label>Noter</label>
      <textarea id="jobNotes" placeholder="Valgfrit..."></textarea>
    </div>

    <div class="field">
      <label>Udstyr til jobbet</label>
      <div class="equip-picker">
        <div class="equip-search">
          <input type="text" id="equipSearch" placeholder="Søg i udstyrsliste (256 stk.)...">
        </div>
        <div class="equip-list" id="equipList"></div>
      </div>
      <div class="selected-strip" id="selectedStrip"></div>
    </div>

    <div id="conflictBox"></div>

    <div class="modal-actions">
      <button class="btn secondary" id="cancelBtn">Annuller</button>
      <button class="btn" id="saveJobBtn">Gem job</button>
    </div>
  </div>
</div>

<div class="overlay" id="equipOverlay">
  <div class="modal">
    <h2 id="equipDetailTitle">Udstyr detaljer</h2>
    <input type="hidden" id="equipDetailIdx">

    <div style="display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;">
      <div style="flex:0 0 120px;">
        <img id="equipImgPreview" src="" style="width:120px; height:120px; border-radius:9px; object-fit:cover; background:var(--panel-2); border:1px solid var(--border); display:none;">
        <div id="equipImgPlaceholder" style="width:120px; height:120px; border-radius:9px; background:var(--panel-2); border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; text-align:center;">Intet billede</div>
        <input type="file" id="equipImgFile" accept="image/*" style="margin-top:8px; font-size:11px; width:120px;">
        <div id="equipImgStatus" style="font-size:10.5px; color:var(--muted); margin-top:4px; font-family:var(--mono);"></div>
      </div>
      <div style="flex:1; min-width:240px;">
        <div class="row2">
          <div class="field"><label>Navn</label><input type="text" id="dName"></div>
          <div class="field"><label>Kategori</label><input type="text" id="dCategory"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Antal i alt</label><input type="number" id="dQty" min="0"></div>
          <div class="field"><label>TV2 nummer</label><input type="text" id="dTv2" placeholder="f.eks. TV2-12345"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Serienummer</label><input type="text" id="dSerial" placeholder="f.eks. SN-9988231"></div>
          <div class="field"><label>Strøm tilslutning</label><input type="text" id="dPower" placeholder="f.eks. 230V Schuko / 32A CEE"></div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Flere felter</label>
      <div id="customFieldsList"></div>
      <button class="btn small secondary" id="addCustomFieldBtn" style="margin-top:6px;">+ Tilføj felt</button>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" id="equipDetailCancelBtn">Annuller</button>
      <button class="btn" id="equipDetailSaveBtn">Gem detaljer</button>
    </div>
  </div>
</div>

let selectedItems = {}; // name -> qty
let editingJobId = null;
let editingEquipName = null;

// ---- equipment (lager) <-> Supabase ----
async function loadEquipment(){
  const { data, error } = await supa.from('equipment').select('*').order('category').order('name');
  if(error){ console.error(error); EQUIPMENT = []; return; }
  EQUIPMENT = data;

  if(EQUIPMENT.length === 0){
    // første gang: fyld databasen med listen fra Excel-arket
    const seedRows = EQUIPMENT_SEED.map(it=>({name: it.name, category: it.category, qty: it.qty}));
    const { data: inserted, error: insErr } = await supa.from('equipment').insert(seedRows).select();
    if(!insErr) EQUIPMENT = inserted;
  }
}

// ---- jobs (bookinger) <-> Supabase ----
function dbJobToApp(j){
  return { id:j.id, name:j.name, who:j.who, start:j.start_date, end:j.end_date, notes:j.notes, items:j.items||[] };
}
async function loadJobs(){
  const { data, error } = await supa.from('jobs').select('*').order('start_date');
  if(error){ console.error(error); jobs = []; return; }
  jobs = data.map(dbJobToApp);
}

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('da-DK', {day:'2-digit', month:'short', year:'numeric'});
}

function datesOverlap(s1,e1,s2,e2){
  return s1 <= e2 && s2 <= e1;
}

function totalQty(name){
  const it = EQUIPMENT.find(i=>i.name===name);
  return it ? it.qty : 1;
}

// booked qty for item in date range, excluding a job id
function bookedQty(name, start, end, excludeJobId){
  let sum = 0;
  const users = [];
  for(const j of jobs){
    if(j.id === excludeJobId) continue;
    if(!j.start || !j.end) continue;
    if(!datesOverlap(start, end, j.start, j.end)) continue;
    const found = (j.items||[]).find(it=>it.name===name);
    if(found){
      sum += found.qty;
      users.push(j.name + ' (' + found.qty + ')');
    }
  }
  return {sum, users};
}

// ---- tabs ----
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));

// ---- render job list ----
function renderJobs(){
  const list = document.getElementById('jobsList');
  document.getElementById('jobsLoading').style.display = 'none';

  const filterStart = document.getElementById('filterStart').value;
  const filterEnd   = document.getElementById('filterEnd').value;

  // filter: show jobs that overlap with the selected period
  const visible = jobs.filter(j => {
    if(!j.start || !j.end) return true;
    if(filterStart && j.end   < filterStart) return false;
    if(filterEnd   && j.start > filterEnd)   return false;
    return true;
  });

  const countEl = document.getElementById('filterCount');
  if(countEl) countEl.textContent = visible.length + ' af ' + jobs.length + ' jobs';

  if(jobs.length === 0){
    list.innerHTML = '<div class="empty"><div class="big">📋</div>Ingen bookinger endnu.<br>Klik "+ Nyt job" for at oprette den første.</div>';
    return;
  }

  if(visible.length === 0){
    list.innerHTML = '<div class="empty"><div class="big">🔍</div>Ingen jobs i den valgte periode.</div>';
    return;
  }

  const sorted = [...visible].sort((a,b)=> (b.start||'').localeCompare(a.start||''));

  list.innerHTML = sorted.map(j=>{
    const itemCount = (j.items||[]).length;
    const totalQtyAll = (j.items||[]).reduce((s,i)=>s+i.qty,0);

    // check conflicts for this job's items right now
    let conflictCount = 0;
    (j.items||[]).forEach(it=>{
      const {sum} = bookedQty(it.name, j.start, j.end, j.id);
      if(sum + it.qty > totalQty(it.name)) conflictCount++;
    });

    const itemsHtml = (j.items||[]).map(it=>{
      const eq = EQUIPMENT.find(e=>e.name===it.name);
      return `<div class="item-row">
        <div><div>${escapeHtml(it.name)}</div><div class="cat">${eq?escapeHtml(eq.category):''}</div></div>
        <div class="item-qty">×${it.qty}</div>
      </div>`;
    }).join('') || '<div class="empty" style="padding:16px;">Intet udstyr tilføjet</div>';

    return `<div class="job-card" data-id="${j.id}">
      <div class="job-head" onclick="toggleJob('${j.id}')">
        <div>
          <div class="job-title">${escapeHtml(j.name||'(uden navn)')} ${j.who?('· '+escapeHtml(j.who)):''}</div>
          <div class="job-meta">${fmtDate(j.start)} → ${fmtDate(j.end)}</div>
        </div>
        ${conflictCount>0
          ? `<div class="job-conflict-badge">⚠ ${conflictCount} konflikt${conflictCount>1?'er':''}</div>`
          : `<div class="job-count">${itemCount} stk. udstyr · ${totalQtyAll} i alt</div>`}
      </div>
      <div class="job-body" id="body-${j.id}">
        ${j.notes ? `<div class="notes">${escapeHtml(j.notes)}</div>` : ''}
        ${itemsHtml}
        <div class="job-actions">
          <button class="btn small secondary" onclick="event.stopPropagation(); openEdit('${j.id}')">Rediger</button>
          <button class="btn small secondary" onclick="event.stopPropagation(); openCopy('${j.id}')">Kopiér job</button>
          <button class="btn small" onclick="event.stopPropagation(); printPackList('${j.id}')" style="background:var(--panel-2); color:var(--amber); border:1px solid var(--amber-dim);">📄 Pakkeliste</button>
          <button class="btn small danger" onclick="event.stopPropagation(); deleteJob('${j.id}')">Slet job</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleJob(id){
  const body = document.getElementById('body-'+id);
  body.classList.toggle('open');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- modal: open/close ----
const overlay = document.getElementById('overlay');

function openNew(){
  editingJobId = null;
  selectedItems = {};
  document.getElementById('modalTitle').textContent = 'Nyt job';
  document.getElementById('jobName').value = '';
  document.getElementById('jobWho').value = '';
  document.getElementById('jobStart').value = todayStr();
  document.getElementById('jobEnd').value = '';
  document.getElementById('jobNotes').value = '';
  document.getElementById('equipSearch').value = '';

  renderSelectedStrip();
  renderConflicts();

}

function openEdit(id){
  const j = jobs.find(x=>x.id===id);
  if(!j) return;
  editingJobId = id;
  selectedItems = {};
  (j.items||[]).forEach(it=> selectedItems[it.name] = it.qty);
  document.getElementById('modalTitle').textContent = 'Rediger job';
  document.getElementById('jobName').value = j.name || '';
  document.getElementById('jobWho').value = j.who || '';
  document.getElementById('jobStart').value = j.start || '';
  document.getElementById('jobEnd').value = j.end || '';
  document.getElementById('jobNotes').value = j.notes || '';
  document.getElementById('equipSearch').value = '';
  renderEquipList('');
  renderSelectedStrip();
  renderConflicts();
  overlay.classList.add('open');
}

function openCopy(id){
  const j = jobs.find(x=>x.id===id);
  if(!j) return;
  editingJobId = null; // gemmes som NYT job
  selectedItems = {};
  (j.items||[]).forEach(it=> selectedItems[it.name] = it.qty); // genbrug udstyret
  document.getElementById('modalTitle').textContent = 'Kopiér job: ' + (j.name||'');
  document.getElementById('jobName').value = (j.name ? j.name + ' (kopi)' : '');
  document.getElementById('jobWho').value = j.who || '';
  document.getElementById('jobStart').value = todayStr(); // nye datoer skal udfyldes
  document.getElementById('jobEnd').value = '';
  document.getElementById('jobNotes').value = j.notes || '';
  document.getElementById('equipSearch').value = '';
  renderEquipList('');
  renderSelectedStrip();
  renderConflicts();
  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}
document.getElementById('newJobBtn').addEventListener('click', openNew);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

// ---- equipment picker ----
function renderEquipList(filter){
  const container = document.getElementById('equipList');
  const f = filter.trim().toLowerCase();
  const start = document.getElementById('jobStart').value;
  const end = document.getElementById('jobEnd').value;

  const filtered = EQUIPMENT.filter(it => !f || it.name.toLowerCase().includes(f) || it.category.toLowerCase().includes(f));

  let lastCat = null;
  let html = '';
  if(filtered.length === 0){
    html = '<div class="empty" style="padding:20px;">Ingen match</div>';
  }
  filtered.forEach(it=>{
    if(it.category !== lastCat){
      html += `<div class="equip-cat">${escapeHtml(it.category)}</div>`;
      lastCat = it.category;
    }
    const checked = selectedItems.hasOwnProperty(it.name);
    const qty = checked ? selectedItems[it.name] : 1;

    let warnHtml = '';
    let warnClass = '';
    if(checked && start && end){
      const {sum} = bookedQty(it.name, start, end, editingJobId);
      const free = it.qty - sum;
      if(qty > free){
        warnClass = 'warn';
        warnHtml = `<div class="warn-text">kun ${Math.max(free,0)} ledig</div>`;
      }
    }

    html += `<div class="equip-item ${warnClass}">
      <input type="checkbox" data-name="${escapeHtml(it.name)}" ${checked?'checked':''} onchange="toggleEquip(this)">
      <div class="name">${escapeHtml(it.name)}</div>
      ${warnHtml}
      <div class="stock">af ${it.qty}</div>
      ${checked ? `<input type="number" class="qty-input" min="1" max="${it.qty}" value="${qty}" data-name="${escapeHtml(it.name)}" onchange="updateQty(this)">` : ''}
    </div>`;
  });
  container.innerHTML = html;
}

function toggleEquip(checkbox){
  const name = checkbox.dataset.name;
  if(checkbox.checked){
    selectedItems[name] = 1;
  } else {
    delete selectedItems[name];
  }
  renderEquipList(document.getElementById('equipSearch').value);
  renderSelectedStrip();
  renderConflicts();
}

function updateQty(input){
  const name = input.dataset.name;
  let v = parseInt(input.value) || 1;
  if(v < 1) v = 1;
  selectedItems[name] = v;
  renderSelectedStrip();
  renderConflicts();
  renderEquipList(document.getElementById('equipSearch').value);
}

function removeSelected(name){
  delete selectedItems[name];
  renderEquipList(document.getElementById('equipSearch').value);
  renderSelectedStrip();
  renderConflicts();
}

function renderSelectedStrip(){
  const strip = document.getElementById('selectedStrip');
  const names = Object.keys(selectedItems);
  if(names.length===0){
    strip.innerHTML = '';
    return;
  }
  strip.innerHTML = names.map(n=>
    `<div class="chip">${escapeHtml(n)} ×${selectedItems[n]} <button onclick="removeSelected('${n.replace(/'/g,"\\'")}')">&times;</button></div>`
  ).join('');
}

document.getElementById('equipSearch').addEventListener('input', (e)=>{
  renderEquipList(e.target.value);
});
document.getElementById('jobStart').addEventListener('change', ()=>{ renderEquipList(document.getElementById('equipSearch').value); renderConflicts(); });
document.getElementById('jobEnd').addEventListener('change', ()=>{ renderEquipList(document.getElementById('equipSearch').value); renderConflicts(); });

function renderConflicts(){
  const box = document.getElementById('conflictBox');
  const start = document.getElementById('jobStart').value;
  const end = document.getElementById('jobEnd').value;
  const names = Object.keys(selectedItems);

  if(!start || !end || names.length===0){
    box.innerHTML = '';
    return;
  }
  if(start > end){
    box.innerHTML = '<div class="conflict-box">Slut dato skal være efter start dato.</div>';
    return;
  }

  const conflicts = [];
  names.forEach(name=>{
    const qty = selectedItems[name];
    const {sum, users} = bookedQty(name, start, end, editingJobId);
    const free = totalQty(name) - sum;
    if(qty > free){
      conflicts.push(`⚠ ${name}: ønsker ${qty}, kun ${Math.max(free,0)} ledige (booket af: ${users.join(', ')||'—'})`);
    }
  });

  if(conflicts.length===0){
    box.innerHTML = '<div class="conflict-box"><span class="ok">✓ Ingen konflikter — alt udstyr er ledigt i perioden.</span></div>';
  } else {
    box.innerHTML = '<div class="conflict-box">' + conflicts.map(c=>escapeHtml(c)).join('<br>') + '</div>';
  }
}

// ---- save / delete ----
document.getElementById('saveJobBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('jobName').value.trim();
  const who = document.getElementById('jobWho').value.trim();
  const start = document.getElementById('jobStart').value;
  const end = document.getElementById('jobEnd').value;
  const notes = document.getElementById('jobNotes').value.trim();

  if(!name){ alert('Skriv et job navn.'); return; }
  if(!start || !end){ alert('Vælg start- og slutdato.'); return; }
  if(start > end){ alert('Slut dato skal være efter start dato.'); return; }

  const items = Object.keys(selectedItems).map(n=>({name:n, qty:selectedItems[n]}));
  const row = { name, who, start_date:start, end_date:end, notes, items };

  const btn = document.getElementById('saveJobBtn');
  btn.disabled = true; btn.textContent = 'Gemmer...';

  try{
    if(editingJobId){
      const { error } = await supa.from('jobs').update(row).eq('id', editingJobId);
      if(error) throw error;
    } else {
      const { error } = await supa.from('jobs').insert(row);
      if(error) throw error;
    }
    await loadJobs();
    renderJobs();
    closeModal();
  }catch(e){
    console.error(e);
    alert('Der opstod en fejl ved gem. Tjek at SUPABASE_URL og SUPABASE_ANON_KEY er sat korrekt øverst i filen.');
  }finally{
    btn.disabled = false; btn.textContent = 'Gem job';
  }
});

async function deleteJob(id){
  if(!confirm('Slet dette job? Det kan ikke fortrydes.')) return;
  const { error } = await supa.from('jobs').delete().eq('id', id);
  if(error){ console.error(error); alert('Kunne ikke slette job.'); return; }
  await loadJobs();
  renderJobs();
}

// ---- availability tab ----
function renderAvailMatches(filter){
  const box = document.getElementById('availMatches');
  const f = filter.trim().toLowerCase();
  if(!f){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = EQUIPMENT.filter(it=>it.name.toLowerCase().includes(f)).slice(0,12);
  if(matches.length===0){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = '<div class="panel" style="margin-top:8px; padding:8px;">' + matches.map(m=>
    `<div class="equip-item" style="cursor:pointer;" onclick="selectAvailItem('${m.name.replace(/'/g,"\\'")}')">
      <div class="name">${escapeHtml(m.name)}</div>
      <div class="stock">${escapeHtml(m.category)}</div>
    </div>`
  ).join('') + '</div>';
}

let availSelectedName = null;
function selectAvailItem(name){
  availSelectedName = name;
  document.getElementById('availSearch').value = name;
  document.getElementById('availMatches').style.display = 'none';
  runAvailCheck();
}

function runAvailCheck(){
  const result = document.getElementById('availResult');
  const start = document.getElementById('availStart').value;
  const end = document.getElementById('availEnd').value;
  const q = document.getElementById('availSearch').value.trim();

  if(!q){ result.innerHTML=''; return; }

  const eq = EQUIPMENT.find(i=>i.name.toLowerCase() === q.toLowerCase()) ||
             EQUIPMENT.find(i=>i.name.toLowerCase().includes(q.toLowerCase()));
  if(!eq){ result.innerHTML = '<div class="empty">Intet udstyr matcher "'+escapeHtml(q)+'"</div>'; return; }

  if(!start || !end){
    result.innerHTML = `<div class="avail-row"><div>${escapeHtml(eq.name)}</div><div class="avail-free">${eq.qty} stk. i alt — vælg datoer</div></div>`;
    return;
  }

  const {sum, users} = bookedQty(eq.name, start, end, null);
  const free = eq.qty - sum;
  result.innerHTML = `<div class="avail-row">
      <div>
        <div>${escapeHtml(eq.name)}</div>
        ${users.length? `<div class="avail-used-by">Booket: ${escapeHtml(users.join(', '))}</div>`:''}
      </div>
      <div class="avail-free ${free>0?'ok':'bad'}">${free} / ${eq.qty} ledige</div>
    </div>`;
}

document.getElementById('availSearch').addEventListener('input', (e)=>{ renderAvailMatches(e.target.value); runAvailCheck(); });
document.getElementById('availStart').addEventListener('change', runAvailCheck);
document.getElementById('availEnd').addEventListener('change', runAvailCheck);

// ---- lager (equipment) tab ----
function renderLager(filter){
  const list = document.getElementById('lagerList');
  const countEl = document.getElementById('lagerCount');
  const f = (filter||'').trim().toLowerCase();

  const filtered = EQUIPMENT.filter(it => !f || it.name.toLowerCase().includes(f) || it.category.toLowerCase().includes(f));
  countEl.textContent = filtered.length + ' af ' + EQUIPMENT.length + ' stk. udstyr i lageret';

  if(EQUIPMENT.length === 0){
    list.innerHTML = '<div class="empty">Lageret er tomt. Klik "+ Tilføj udstyr" for at starte.</div>';
    return;
  }
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">Ingen match på "'+escapeHtml(filter)+'"</div>';
    return;
  }

  let lastCat = null;
  let html = '';
  filtered.forEach((it, idx)=>{
    const realIdx = EQUIPMENT.indexOf(it);
    if(it.category !== lastCat){
      html += `<div class="equip-cat">${escapeHtml(it.category)}</div>`;
      lastCat = it.category;
    }
    if(editingEquipName === it.name){
      html += `<div class="equip-item" style="gap:8px;">
        <input type="text" id="editName_${realIdx}" value="${escapeHtml(it.name)}" style="flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:5px; font-size:12.5px;">
        <input type="text" id="editCat_${realIdx}" value="${escapeHtml(it.category)}" style="width:160px; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:5px; font-size:12.5px;">
        <input type="number" id="editQty_${realIdx}" value="${it.qty}" min="0" class="qty-input" style="width:60px;">
        <button class="btn small" onclick="saveEquipEdit(${realIdx})">Gem</button>
        <button class="btn small secondary" onclick="editingEquipName=null; renderLager(document.getElementById('lagerSearch').value);">Fortryd</button>
      </div>`;
    } else {
      const thumb = it.image_url ? `<img src="${escapeHtml(it.image_url)}" style="width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0;">` : '';
      html += `<div class="equip-item">
        ${thumb}
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="stock">${it.qty} stk.</div>
        <button class="btn small secondary" onclick="openEquipDetail(${realIdx})">Detaljer</button>
        <button class="btn small secondary" onclick="editingEquipName='${it.name.replace(/'/g,"\\'")}'; renderLager(document.getElementById('lagerSearch').value);">Rediger</button>
        <button class="btn small danger" onclick="deleteEquip(${realIdx})">Slet</button>
      </div>`;
    }
  });
  list.innerHTML = html;
}

async function saveEquipEdit(idx){
  const item = EQUIPMENT[idx];
  const name = document.getElementById('editName_'+idx).value.trim();
  const category = document.getElementById('editCat_'+idx).value.trim() || 'Diverse';
  let qty = parseInt(document.getElementById('editQty_'+idx).value);
  if(!name){ alert('Navn må ikke være tomt.'); return; }
  if(isNaN(qty) || qty < 0) qty = 0;

  const { error } = await supa.from('equipment').update({name, category, qty}).eq('id', item.id);
  if(error){ console.error(error); alert('Kunne ikke gemme ændringen.'); return; }
  await loadEquipment();
  editingEquipName = null;
  renderLager(document.getElementById('lagerSearch').value);
  renderJobs();
}

async function deleteEquip(idx){
  const it = EQUIPMENT[idx];
  if(!confirm('Slet "'+it.name+'" fra lageret? Dette fjerner det ikke fra eksisterende jobs.')) return;
  const { error } = await supa.from('equipment').delete().eq('id', it.id);
  if(error){ console.error(error); alert('Kunne ikke slette.'); return; }
  await loadEquipment();
  renderLager(document.getElementById('lagerSearch').value);
}

document.getElementById('lagerSearch').addEventListener('input', (e)=> renderLager(e.target.value));

async function confirmAddEquip(){
  const name = document.getElementById('newEquipName').value.trim();
  const category = document.getElementById('newEquipCat').value.trim() || 'Diverse';
  let qty = parseInt(document.getElementById('newEquipQty').value);
  if(!name){ alert('Skriv et navn.'); return; }
  if(isNaN(qty) || qty < 0) qty = 0;
  if(EQUIPMENT.some(e=>e.name.toLowerCase()===name.toLowerCase())){ alert('Der findes allerede udstyr med det navn.'); return; }

  const { error } = await supa.from('equipment').insert({name, category, qty});
  if(error){ console.error(error); alert('Kunne ikke tilføje udstyr.'); return; }
  await loadEquipment();
  document.getElementById('lagerNewRow').style.display = 'none';
  renderLager(document.getElementById('lagerSearch').value);
}

// ---- equipment detail modal ----
const equipOverlay = document.getElementById('equipOverlay');
let detailCustomFields = []; // [{label, value}]
let detailCurrentIdx = null;
let detailPendingFile = null;

function openEquipDetail(idx){
  const it = EQUIPMENT[idx];
  if(!it) return;
  detailCurrentIdx = idx;
  detailPendingFile = null;
  document.getElementById('equipDetailTitle').textContent = 'Detaljer: ' + it.name;
  document.getElementById('dName').value = it.name || '';
  document.getElementById('dCategory').value = it.category || '';
  document.getElementById('dQty').value = it.qty || 0;
  document.getElementById('dTv2').value = it.tv2_number || '';
  document.getElementById('dSerial').value = it.serial_number || '';
  document.getElementById('dPower').value = it.power_connection || '';
  document.getElementById('equipImgFile').value = '';
  document.getElementById('equipImgStatus').textContent = '';

  const preview = document.getElementById('equipImgPreview');
  const placeholder = document.getElementById('equipImgPlaceholder');

function renderCustomFields(){
  const container = document.getElementById('customFieldsList');
  if(detailCustomFields.length === 0){
    container.innerHTML = '<div style="font-size:11.5px; color:var(--muted);">Ingen ekstra felter endnu.</div>';

document.getElementById('equipDetailSaveBtn').addEventListener('click', async ()=>{
  const it = EQUIPMENT[detailCurrentIdx];
  if(!it) return;
  const btn = document.getElementById('equipDetailSaveBtn');
  btn.disabled = true; btn.textContent = 'Gemmer...';
  const statusEl = document.getElementById('equipImgStatus');

  try{
    let image_url = it.image_url || null;

    if(detailPendingFile){
      statusEl.textContent = 'Uploader billede...';
      const ext = detailPendingFile.name.split('.').pop();
      const path = 'equip_' + it.id + '_' + Date.now() + '.' + ext;
      const { error: upErr } = await supa.storage.from('udstyr-billeder').upload(path, detailPendingFile, {upsert:true});
      if(upErr){
        statusEl.textContent = '';
        alert('Kunne ikke uploade billede. Tjek at bucket "udstyr-billeder" findes og er public. (' + upErr.message + ')');
      } else {
        const { data: pub } = supa.storage.from('udstyr-billeder').getPublicUrl(path);

      }
    }

    const name = document.getElementById('dName').value.trim();

    const { error } = await supa.from('equipment').update({
      name, category, qty, tv2_number, serial_number, power_connection, image_url, custom_fields
    }).eq('id', it.id);

  }

// ---- statistik ----
const MONTHS_DA = ['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];

function bookedDaysInMonth(job, year, month){
  // returns overlap days between job period and the given month
  if(!job.start || !job.end) return 0;
  const mStart = new Date(year, month, 1);
  const mEnd   = new Date(year, month+1, 0); // last day of month
  const jStart = new Date(job.start+'T00:00:00');
  const jEnd   = new Date(job.end+'T00:00:00');
  const overlapStart = jStart > mStart ? jStart : mStart;
  const overlapEnd   = jEnd   < mEnd   ? jEnd   : mEnd;
  if(overlapEnd < overlapStart) return 0;
  return Math.round((overlapEnd - overlapStart)/(1000*60*60*24)) + 1;
}

function initStatsControls(){
  // populate year selector
  const years = new Set();
  const thisYear = new Date().getFullYear();
  years.add(thisYear); years.add(thisYear-1);
  jobs.forEach(j=>{ if(j.start) years.add(parseInt(j.start.slice(0,4))); });
  const yearSel = document.getElementById('statsYear');
  yearSel.innerHTML = [...years].sort((a,b)=>b-a).map(y=>`<option value="${y}">${y}</option>`).join('');

  // populate category selector
  const cats = new Set(EQUIPMENT.map(e=>e.category));
  const catSel = document.getElementById('statsCat');
  catSel.innerHTML = '<option value="">Alle kategorier</option>' +
    [...cats].sort().map(c=>`<option value="${c}">${escapeHtml(c)}</option>`).join('');
}

function renderStats(){
  initStatsControls();
  computeAndRenderStats();
}

function computeAndRenderStats(){
  const year   = parseInt(document.getElementById('statsYear').value);
  const catFilter = document.getElementById('statsCat').value;
  const sort   = document.getElementById('statsSort').value;
  const metric = document.getElementById('statsMetric').value; // 'days' or 'jobs'

  // build per-item monthly data
  const itemMap = {}; // name -> {cat, monthly:[12 numbers], total}

  let equipment = EQUIPMENT;
  if(catFilter) equipment = equipment.filter(e=>e.category===catFilter);

  equipment.forEach(eq=>{
    itemMap[eq.name] = {name:eq.name, cat:eq.category, monthly:Array(12).fill(0), total:0, peak:0};
  });

  jobs.forEach(job=>{
    if(!job.start) return;
    const jYear = parseInt(job.start.slice(0,4));
    const jEndYear = job.end ? parseInt(job.end.slice(0,4)) : jYear;
    if(jYear > year || jEndYear < year) return; // job not in this year at all

    (job.items||[]).forEach(it=>{
      if(!itemMap[it.name]) return; // filtered out
      for(let m=0; m<12; m++){
        let val = 0;
        if(metric === 'days'){
          val = bookedDaysInMonth(job, year, m) * it.qty;
        } else {
          // count job once per month it overlaps
          const mStart = new Date(year, m, 1);
          const mEnd   = new Date(year, m+1, 0);
          const jS = new Date(job.start+'T00:00:00');
          const jE = job.end ? new Date(job.end+'T00:00:00') : jS;
          if(jS <= mEnd && jE >= mStart) val = 1;
        }
        itemMap[it.name].monthly[m] += val;
        itemMap[it.name].total += val;
      }
    });
  });

  // compute peak
  Object.values(itemMap).forEach(it=>{
    it.peak = Math.max(...it.monthly);
  });

  let items = Object.values(itemMap).filter(it=>it.total>0);

  if(sort==='total') items.sort((a,b)=>b.total-a.total);
  else if(sort==='name') items.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='peak') items.sort((a,b)=>b.peak-a.peak);

  // summary cards
  const totalDays = items.reduce((s,i)=>s+i.total,0);
  const topItem = items[0];
  const activeCount = items.length;
  const peakMonth = (() => {
    const byMonth = Array(12).fill(0);
    items.forEach(it=>it.monthly.forEach((v,m)=>byMonth[m]+=v));
    const max = Math.max(...byMonth);
    return {month: MONTHS_DA[byMonth.indexOf(max)], val: max};
  })();

  document.getElementById('statsSummary').innerHTML = [
    {label: metric==='days'?'Totale lejedage':'Totale job-bookinger', val: totalDays.toLocaleString('da-DK')},
    {label: 'Aktive stykker udstyr', val: activeCount},
    {label: 'Mest brugte udstyr', val: topItem ? topItem.name.slice(0,28)+(topItem.name.length>28?'…':'') : '—'},
    {label: 'Travleste måned', val: peakMonth.val > 0 ? `${peakMonth.month} (${peakMonth.val})` : '—'},
  ].map(s=>`<div class="panel" style="padding:12px 14px;">
    <div style="font-size:10px; color:var(--muted); font-family:var(--mono); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;">${s.label}</div>
    <div style="font-size:16px; font-weight:800; color:var(--amber);">${escapeHtml(String(s.val))}</div>
  </div>`).join('');

  if(items.length===0){
    document.getElementById('statsContent').innerHTML =
      '<div class="empty"><div class="big">📊</div>Ingen bookinger fundet for '+year+(catFilter?' i kategorien '+escapeHtml(catFilter):'')+'</div>';
    return;
  }

  // find global max for bar scaling
  const globalMax = Math.max(...items.flatMap(i=>i.monthly), 1);
  const metricLabel = metric==='days' ? 'dage' : 'jobs';

  const rows = items.map(it=>{
    const bars = it.monthly.map((v,m)=>{
      const pct = Math.round((v/globalMax)*100);
      const title = `${MONTHS_DA[m]}: ${v} ${metricLabel}`;
      return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <div style="font-size:8px; color:${v>0?'var(--amber)':'var(--muted)'}; font-family:var(--mono); font-weight:${v>0?700:400};">${v>0?v:''}</div>
        <div title="${title}" style="width:100%; background:var(--border); border-radius:2px; height:28px; display:flex; align-items:flex-end;">
          <div style="width:100%; height:${pct}%; background:${pct>66?'var(--amber)':pct>33?'#b07d2a':'#5c4521'}; border-radius:2px; min-height:${v>0?2:0}px; transition:height .2s;"></div>
        </div>
        <div style="font-size:7.5px; color:var(--muted); font-family:var(--mono);">${MONTHS_DA[m]}</div>
      </div>`;
    }).join('');

    return `<div style="background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px;">
        <div>
          <div style="font-size:13px; font-weight:700;">${escapeHtml(it.name)}</div>
          <div style="font-size:10px; color:var(--muted); font-family:var(--mono); margin-top:1px;">${escapeHtml(it.cat)}</div>
        </div>
        <div style="text-align:right; flex-shrink:0;">
          <div style="font-size:16px; font-weight:800; color:var(--amber); font-family:var(--mono);">${it.total}</div>
          <div style="font-size:9px; color:var(--muted);">${metricLabel} i ${year}</div>
        </div>
      </div>
      <div style="display:flex; gap:3px; align-items:flex-end; height:58px;">${bars}</div>
    </div>`;
  }).join('');

  document.getElementById('statsContent').innerHTML = `
    <div style="font-size:11px; color:var(--muted); font-family:var(--mono); margin-bottom:10px;">
      Viser ${items.length} stykker udstyr med bookinger i ${year} · ${metric==='days'?'Målt i dage':'Målt i antal jobs'}
    </div>
    ${rows}`;
}

// export CSV
document.getElementById('statsExportBtn').addEventListener('click', ()=>{
  const year = parseInt(document.getElementById('statsYear').value);
  const catFilter = document.getElementById('statsCat').value;
  const metric = document.getElementById('statsMetric').value;

  const itemMap = {};
  let equipment = EQUIPMENT;
  if(catFilter) equipment = equipment.filter(e=>e.category===catFilter);
  equipment.forEach(eq=>{ itemMap[eq.name]={name:eq.name, cat:eq.category, monthly:Array(12).fill(0)}; });

  jobs.forEach(job=>{
    if(!job.start) return;
    const jYear = parseInt(job.start.slice(0,4));
    const jEndYear = job.end ? parseInt(job.end.slice(0,4)) : jYear;
    if(jYear > year || jEndYear < year) return;
    (job.items||[]).forEach(it=>{
      if(!itemMap[it.name]) return;
      for(let m=0; m<12; m++){
        if(metric==='days'){
          itemMap[it.name].monthly[m] += bookedDaysInMonth(job, year, m) * it.qty;
        } else {
          const mStart=new Date(year,m,1), mEnd=new Date(year,m+1,0);
          const jS=new Date(job.start+'T00:00:00'), jE=job.end?new Date(job.end+'T00:00:00'):jS;
          if(jS<=mEnd && jE>=mStart) itemMap[it.name].monthly[m]+=1;
        }
      }
    });
  });

  const label = metric==='days'?'Dage booket':'Antal jobs';
  const header = ['Udstyr','Kategori',...MONTHS_DA.map(m=>m+' '+year),'Total'].join(';');
  const rows = Object.values(itemMap).filter(i=>i.monthly.some(v=>v>0)).map(i=>{
    const total = i.monthly.reduce((s,v)=>s+v,0);
    return ['"'+i.name+'"', '"'+i.cat+'"', ...i.monthly, total].join(';');
  });
  const csv = [header,...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`udstyr-statistik-${year}.csv`; a.click();
  URL.revokeObjectURL(url);
});

});

// ---- date helpers ----
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function addMonths(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0,10);
}

// ---- filter bar setup ----
function initFilterDates(){
  const t = todayStr();
  document.getElementById('filterStart').value = t;
  document.getElementById('filterEnd').value   = addMonths(t, 1);
}

document.getElementById('filterStart').addEventListener('change', ()=> renderJobs());
document.getElementById('filterEnd').addEventListener('change',   ()=> renderJobs());
document.getElementById('filterResetBtn').addEventListener('click', ()=>{
  initFilterDates();
  renderJobs();
});

// ---- avail tab: set today as default start ----
document.getElementById('availStart').value = todayStr();

// ---- init ----
(async function init(){
  initFilterDates();
  await loadEquipment();
  await loadJobs();
  renderJobs();

  // opdater automatisk hvert 15. sekund, så man ser kollegers nye bookinger
  setInterval(async ()=>{
    if(overlay.classList.contains('open')) return; // forstyr ikke mens nogen redigerer
    await loadJobs();
    renderJobs();
  }, 15000);
})();
</script>
</body>
</html>
