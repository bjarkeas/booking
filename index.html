// JOBS GANTT (Puljeudstyr tidslinje)
// ═══════════════════════════════════════════════════════════
function renderJobsGantt(){
  var wrap = document.getElementById('jobsGanttWrap');
  if(!wrap) return;
  wrap.innerHTML = '';

  var fStart = document.getElementById('filterStart').value;
  var fEnd   = document.getElementById('filterEnd').value;

  // Only show jobs in current filter period
  var visible = jobs.filter(function(j){
    if(!j.start||!j.end) return false;
    if(fStart && j.end   < fStart) return false;
    if(fEnd   && j.start > fEnd)   return false;
    return true;
  }).sort(function(a,b){ return a.start.localeCompare(b.start); });

  if(!visible.length){
    wrap.innerHTML = '<div style="font-size:11px;color:var(--muted);font-family:var(--mono);padding:6px 0;">Ingen jobs i perioden at vise i tidslinje.</div>';
    return;
  }

  // Date range for gantt = filter period or ±7 days around jobs
  var gStart = fStart || visible[0].start;
  var gEnd   = fEnd   || visible[visible.length-1].end;

  // Parse to Date objects
  var startDt = new Date(gStart+'T00:00:00');
  var endDt   = new Date(gEnd  +'T00:00:00');
  var DAYS    = Math.min(Math.round((endDt-startDt)/(1000*60*60*24))+1, 120);
  var COL_W   = Math.max(Math.floor((window.innerWidth - 140) / DAYS), 12);
  COL_W       = Math.min(COL_W, 32);

  var days = [];
  for(var i=0;i<DAYS;i++){
    var d=new Date(startDt); d.setDate(d.getDate()+i); days.push(d);
  }

  var DA_M=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  var DA_D=['Sø','Ma','Ti','On','To','Fr','Lø'];
  var todayStr2 = todayStr();

  var wrapper=document.createElement('div');
  wrapper.style.cssText='overflow-x:auto;border:1px solid var(--border);border-radius:10px;';

  var table=document.createElement('div');
  table.style.cssText='display:grid;grid-template-columns:140px repeat('+DAYS+','+COL_W+'px);min-width:'+(140+DAYS*COL_W)+'px;font-size:11px;';

  // Month header row
  var c0=document.createElement('div'); c0.style.cssText='background:var(--panel-2);border-bottom:1px solid var(--border);padding:3px 6px;font-size:9px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;';c0.textContent='Job'; table.appendChild(c0);
  var lastM=-1;
  days.forEach(function(d,i){
    var isToday=d.toISOString().slice(0,10)===todayStr2;
    var c=document.createElement('div');
    c.style.cssText='border-bottom:1px solid var(--border);border-left:1px solid '+(isToday?'var(--amber)':'var(--border)')+';text-align:center;padding:2px 0;background:var(--panel-2);font-family:var(--mono);color:'+(isToday?'var(--amber)':'var(--muted)')+';font-size:9px;font-weight:'+(d.getMonth()!==lastM?700:400)+';';
    if(d.getMonth()!==lastM){c.textContent=DA_M[d.getMonth()];lastM=d.getMonth();}
    table.appendChild(c);
  });

  // Day header row
  var dh=document.createElement('div'); dh.style.cssText='background:var(--panel-2);border-bottom:2px solid var(--border);padding:2px 4px;color:var(--muted);font-family:var(--mono);font-size:9px;'; dh.textContent=''; table.appendChild(dh);
  days.forEach(function(d,i){
    var isToday=d.toISOString().slice(0,10)===todayStr2;
    var isWE=d.getDay()===0||d.getDay()===6;
    var c=document.createElement('div');
    c.style.cssText='border-bottom:2px solid '+(isToday?'var(--amber)':'var(--border)')+';border-left:1px solid '+(isToday?'var(--amber)':'var(--border)')+';text-align:center;padding:1px 0;background:'+(isToday?'rgba(232,163,61,.1)':isWE?'rgba(255,255,255,.02)':'var(--panel-2)')+';font-family:var(--mono);color:'+(isToday?'var(--amber)':isWE?'#6b6f7a':'var(--muted)')+';font-size:8px;';
    c.textContent=d.getDate()+(COL_W>18?' '+DA_D[d.getDay()]:'');
    table.appendChild(c);
  });

  // Job rows
  visible.forEach(function(j, ri){
    var isLast = ri===visible.length-1;
    var border = isLast?'none':'1px solid var(--border)';
    var isTilbud = j.status==='tilbud';

    // Label cell
    var lc=document.createElement('div');
    lc.style.cssText='padding:5px 8px;border-bottom:'+border+';display:flex;align-items:center;gap:6px;background:var(--panel);cursor:pointer;overflow:hidden;';
    lc.title=j.name+(j.who?' ('+j.who+')':'');
    if(isTilbud){
      var tb=document.createElement('span'); tb.style.cssText='background:#5c4521;color:var(--amber);font-size:8px;padding:1px 4px;border-radius:4px;font-family:var(--mono);font-weight:700;flex-shrink:0;'; tb.textContent='T'; lc.appendChild(tb);
    }
    var nm=document.createElement('span'); nm.style.cssText='font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'; nm.textContent=j.name; lc.appendChild(nm);
    lc.addEventListener('click', function(){ toggleJob(j.id); document.getElementById('body-'+j.id).scrollIntoView({behavior:'smooth',block:'nearest'}); });
    table.appendChild(lc);

    // Day cells
    var jobStart = j.start; var jobEnd = j.end;
    var inBlock = false; var span = 0;
    var i = 0;
    while(i < DAYS){
      var iso = days[i].toISOString().slice(0,10);
      var isToday = iso === todayStr2;
      var isWE = days[i].getDay()===0||days[i].getDay()===6;

      if(iso >= jobStart && iso <= jobEnd){
        // Count span
        span = 0;
        while(i+span < DAYS && days[i+span].toISOString().slice(0,10) <= jobEnd) span++;
        span = Math.max(span, 1);

        var color  = isTilbud ? '#e8a33d' : '#5fb88a';
        var bg     = isTilbud ? 'rgba(232,163,61,.2)' : 'rgba(95,184,138,.2)';
        var border2= isTilbud ? '2px dashed '+color : '3px solid '+color;

        var block=document.createElement('div');
        block.style.cssText='grid-column:span '+span+';border-bottom:'+border+';background:'+bg+';border-left:'+border2+';padding:3px 5px;display:flex;align-items:center;cursor:pointer;overflow:hidden;';
        block.title=j.name+'\n'+fmtDate(j.start)+' → '+fmtDate(j.end)+(j.who?'\n'+j.who:'');
        var lbl=document.createElement('span'); lbl.style.cssText='font-size:10px;font-weight:700;color:'+color+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;';
        lbl.textContent=(j.who||'');
        block.appendChild(lbl);
        block.addEventListener('click', (function(jj){ return function(){ openEdit(jj.id); }; })(j));
        table.appendChild(block);
        i += span;
      } else {
        var ec=document.createElement('div');
        ec.style.cssText='border-bottom:'+border+';border-left:1px solid '+(isToday?'var(--amber)':'var(--border)')+';background:'+(isToday?'rgba(232,163,61,.04)':isWE?'rgba(255,255,255,.01)':'transparent')+';';
        table.appendChild(ec);
        i++;
      }
    }
  });

  wrapper.appendChild(table);

  // Legend
  var legend=document.createElement('div');
  legend.style.cssText='display:flex;gap:16px;padding:6px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);';
  legend.innerHTML='<span style="color:#5fb88a;">— Ordre</span><span style="color:#e8a33d;">╌ Tilbud</span><span>Klik på blok = rediger job</span>';
  wrapper.appendChild(legend);
  wrap.appendChild(wrapper);
}

// ── Multi-select state ─────────────────────────────────────
let multiSelected = new Set(); // Set of equipment IDs
let multiMode = false;

function toggleMultiMode(){
  multiMode = !multiMode;
  multiSelected.clear();
  const btn = document.getElementById('multiModeBtn');
  if(btn){
    btn.textContent = multiMode ? '✕ Annuller valg' : '☑ Vælg flere';
    btn.style.color = multiMode ? 'var(--red)' : '';
    btn.style.borderColor = multiMode ? 'var(--red)' : '';
  }
  renderLager(document.getElementById('lagerSearch').value||'');
}

function toggleMultiSelect(equipId){
  if(multiSelected.has(equipId)) multiSelected.delete(equipId);
  else multiSelected.add(equipId);
  updateBulkBar();
}

function selectAll(checked){
  if(checked){
    EQUIPMENT.filter(function(e){ return !e.package_id; }).forEach(function(e){ multiSelected.add(e.id); });
  } else {
    multiSelected.clear();
  }
  updateBulkBar();
  renderLager(document.getElementById('lagerSearch').value||'');
}

function updateBulkBar(){
  const bar = document.getElementById('bulkBar');
  if(!bar) return;
  const n = multiSelected.size;
  if(!multiMode || n===0){
    bar.style.display='none'; return;
  }
  bar.style.display='flex';
  document.getElementById('bulkCount').textContent = n + ' stykker valgt';
}

async function bulkMoveToPackage(pkgId){
  if(!pkgId || !multiSelected.size) return;
  const ids = [...multiSelected];
  for(const id of ids){
    await supa.from('equipment').update({package_id:pkgId}).eq('id',id);
  }

// ── Lookup by QR/serial ───────────────────────────────────
function findByQr(code){
  const c = code.trim();
  if(!c) return null;
  // Search equipment: qr_code field first, then serial_number
  const eq = EQUIPMENT.find(function(e){
    return (e.qr_code && e.qr_code.trim().toLowerCase() === c.toLowerCase())
        || (e.serial_number && e.serial_number.trim().toLowerCase() === c.toLowerCase());
  });
  if(eq) return {type:'equip', item:eq};
  // Search packages
  const pkg = PACKAGES.find(function(p){
    return (p.qr_code && p.qr_code.trim().toLowerCase() === c.toLowerCase())
        || (p.serial_number && p.serial_number.trim().toLowerCase() === c.toLowerCase());
  });
  if(pkg) return {type:'pkg', item:pkg};
  return null;
}

// ── QR not found: offer to link or create ─────────────────
function handleUnknownQr(code, onLinked){
  const items = [
    ...PACKAGES.map(function(p){ return {label:'📦 '+p.name, id:p.id, type:'pkg'}; }),
    ...EQUIPMENT.filter(function(e){ return !e.package_id; }).map(function(e){ return {label:e.name, id:e.id, type:'equip'}; })
  ];

  const overlay = document.getElementById('qrUnknownOverlay');
  document.getElementById('qrUnknownCode').textContent = code;
  const sel = document.getElementById('qrLinkSelect');
  sel.innerHTML = '<option value="">— Vælg eksisterende udstyr/pakke —</option>'
    + items.map(function(i){ return '<option value="'+i.type+':'+i.id+'">'+escapeHtml(i.label)+'</option>'; }).join('');

  document.getElementById('qrLinkBtn').onclick = async function(){
    const val = sel.value;
    if(!val){ alert('Vælg et stykke udstyr.'); return; }
    const [type, id] = val.split(':');
    const field = { qr_code: code };
    const tbl = type==='pkg' ? 'packages' : 'equipment';
    const { error } = await supa.from(tbl).update(field).eq('id', id);
    if(error){ alert('Fejl: '+error.message); return; }
    await (type==='pkg' ? loadPackages() : loadEquipment());
    overlay.classList.remove('open');
    const found = findByQr(code);
    if(found && onLinked) onLinked(found);
  };

  document.getElementById('qrCreateBtn').onclick = function(){
    overlay.classList.remove('open');
    // Pre-fill the new equipment form and set qr_code
    document.getElementById('lagerNewRow').style.display = 'block';
    document.getElementById('lagerNewRow').innerHTML =
      '<div class="panel" style="padding:12px;background:var(--panel-2);border:1px solid var(--amber);">'
      +'<div style="font-size:11px;color:var(--amber);font-family:var(--mono);margin-bottom:8px;">Opretter nyt udstyr med QR: '+escapeHtml(code)+'</div>'
      +'<div class="row3">'
      +'<div class="field"><label>Navn</label><input type="text" id="newEquipName" placeholder="f.eks. Wisycom MCH55"></div>'
      +'<div class="field"><label>Kategori</label><select id="newEquipCat" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:7px;font-size:13px;"></select></div>'
      +'<div class="field"><label>Antal</label><input type="number" id="newEquipQty" value="1" min="0"></div>'
      +'</div>'
      +'<div class="modal-actions">'
      +'<button class="btn small secondary" onclick="document.getElementById(\'lagerNewRow\').style.display=\'none\';">Annuller</button>'
      +'<button class="btn small" onclick="confirmAddEquipWithQr(\''+code.replace(/'/g,"\\'")+'\')" >Tilføj</button>'
      +'</div></div>';
    populateCategoryDropdowns();
    // Switch to lager tab
    document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab==='lager'); });
    ['jobs','avail','obvogne','stats'].forEach(function(t){ var el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
    document.getElementById('tab-lager').style.display='block';
    Promise.all([loadPackages(),loadEquipment()]).then(function(){ renderLager(''); });
  };

  overlay.classList.add('open');
}

async function confirmAddEquipWithQr(qrCode){
  const name = document.getElementById('newEquipName').value.trim();
  const category = document.getElementById('newEquipCat').value || 'Diverse';
  let qty = parseInt(document.getElementById('newEquipQty').value); if(isNaN(qty)||qty<0) qty=0;
  if(!name){ alert('Skriv et navn.'); return; }
  const { error } = await supa.from('equipment').insert({name,category,qty,qr_code:qrCode,serial_number:qrCode});
  if(error){ alert('Fejl: '+error.message); return; }
  await loadEquipment();
  document.getElementById('lagerNewRow').style.display='none';
  renderLager('');
}

// ── Scanner overlay (camera + USB) ─────────────────────────
let qrScanCallback = null; // function(found) called on successful scan
let html5QrScanner = null;
let usbScanBuffer = '';
let usbScanTimer = null;

function openQrScanner(callback){
  qrScanCallback = callback;
  document.getElementById('qrScanOverlay').classList.add('open');
  document.getElementById('qrManualInput').value='';
  document.getElementById('qrScanStatus').textContent='';
  startCameraScanner();
  // USB scanner listener
  document.getElementById('qrManualInput').focus();
}

function closeQrScanner(){
  stopCameraScanner();
  document.getElementById('qrScanOverlay').classList.remove('open');
  qrScanCallback = null;
}

function startCameraScanner(){
  if(typeof Html5Qrcode === 'undefined') return;
  try{
    html5QrScanner = new Html5Qrcode('qrCameraView');
    html5QrScanner.start(
      { facingMode: 'environment' },
      { fps:10, qrbox:{width:250,height:250} },
      function(code){
        stopCameraScanner();
        handleScannedCode(code);
      },
      function(){}
    ).catch(function(e){
      document.getElementById('qrScanStatus').textContent = 'Kamera ikke tilgængeligt — brug manuel input nedenfor.';
    });
  }catch(e){
    document.getElementById('qrScanStatus').textContent = 'Kamera ikke tilgængeligt.';
  }
}

function stopCameraScanner(){
  if(html5QrScanner){
    html5QrScanner.stop().catch(function(){});
    html5QrScanner.clear();
    html5QrScanner = null;
  }
}

function handleScannedCode(code){
  code = code.trim();
  if(!code) return;
  document.getElementById('qrScanStatus').innerHTML = '<span style="color:var(--muted);">Scannet: '+escapeHtml(code)+'</span>';
  const found = findByQr(code);
  if(found){
    closeQrScanner();
    if(qrScanCallback) qrScanCallback(found);
  } else {
    closeQrScanner();
    handleUnknownQr(code, qrScanCallback);
  }
}

// Manual input (also catches USB scanner which types fast then presses Enter)
document.getElementById('qrManualInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    const val = document.getElementById('qrManualInput').value.trim();
    if(val) handleScannedCode(val);
  }
});
document.getElementById('qrManualConfirmBtn').addEventListener('click', function(){
  const val = document.getElementById('qrManualInput').value.trim();
  if(val) handleScannedCode(val);
});

document.getElementById('qrScanOverlay').addEventListener('click', function(e){
  if(e.target===document.getElementById('qrScanOverlay')) closeQrScanner();
});
document.getElementById('qrCloseScanBtn').addEventListener('click', closeQrScanner);

// ── Scan to add to job ────────────────────────────────────
function scanToAddToJob(){
  openQrScanner(function(found){
    const key = found.type==='pkg' ? 'PKG:'+found.item.id : found.item.name;
    const label = found.type==='pkg' ? found.item.name+' (pakke)' : found.item.name;
    if(selectedItems[key]){
      selectedItems[key]++;
    } else {
      selectedItems[key] = 1;
    }
    renderEquipList(document.getElementById('equipSearch').value||'');
    renderSelectedStrip();
    renderConflicts();
    // Show feedback and offer to scan more
    setTimeout(function(){
      if(confirm('Tilføjet: '+label+'\n\nScan næste stykke udstyr?')){
        scanToAddToJob();
      }
    }, 100);
  });
}

// ── Scan for availability check ───────────────────────────
function scanForAvailability(){
  openQrScanner(function(found){
    const name = found.item.name;
    document.getElementById('availSearch').value = name;
    runAvailCheck();
  });
}
