<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udstyr Booking — OB Pulje</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#14161b;
    --panel:#1c1f26;
    --panel-2:#23262e;
    --border:#2e323c;
    --text:#e9eaee;
    --muted:#8b8f9c;
    --amber:#e8a33d;
    --amber-dim:#5c4521;
    --green:#5fb88a;
    --red:#e2685f;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber-dim); }
  .app{ max-width:1100px; margin:0 auto; padding:20px 18px 60px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0 18px; border-bottom:1px solid var(--border); margin-bottom:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .brand h1{ font-size:16px; letter-spacing:.06em; text-transform:uppercase; margin:0; font-weight:700; }
  .brand .sub{ font-size:11px; color:var(--muted); font-family:var(--mono); letter-spacing:.04em; }

  .btn{
    background:var(--amber); color:#1a1407; border:none; font-weight:700;
    padding:10px 16px; border-radius:7px; cursor:pointer; font-size:13px;
    transition:filter .15s ease; letter-spacing:.01em;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .btn.secondary:hover{ filter:brightness(1.15); }
  .btn.danger{ background:transparent; color:var(--red); border:1px solid #4a2c2a; }
  .btn.danger:hover{ background:#2a1a18; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.small{ padding:6px 11px; font-size:12px; border-radius:6px; }

  nav.tabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); }
  nav.tabs button{
    background:none; border:none; color:var(--muted); padding:10px 4px; margin-right:18px;
    font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
    letter-spacing:.02em;
  }
  nav.tabs button.active{ color:var(--amber); border-bottom-color:var(--amber); }

  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty .big{ font-size:30px; margin-bottom:8px; }

  /* Job list */
  .job-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    margin-bottom:10px; overflow:hidden;
  }
  .job-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    cursor:pointer; gap:12px;
  }
  .job-head:hover{ background:var(--panel-2); }
  .job-title{ font-weight:700; font-size:14.5px; }
  .job-meta{ font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:3px; }
  .job-count{
    font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--panel-2);
    border:1px solid var(--border); padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .job-conflict-badge{
    font-family:var(--mono); font-size:11px; color:var(--red); background:#2a1a18;
    border:1px solid #4a2c2a; padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .job-body{ border-top:1px solid var(--border); padding:14px 16px; display:none; }
  .job-body.open{ display:block; }
  .job-body .notes{ font-size:12.5px; color:var(--muted); margin-bottom:10px; white-space:pre-wrap;}
  .item-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px solid #25282f; font-size:13px;
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row .cat{ font-size:10px; color:var(--muted); font-family:var(--mono); }
  .item-qty{ font-family:var(--mono); color:var(--amber); font-weight:700; min-width:34px; text-align:right; }
  .job-actions{ display:flex; gap:8px; margin-top:14px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    width:100%; max-width:760px; padding:22px; margin-bottom:30px;
  }
  .modal h2{ margin:0 0 16px; font-size:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 10px; border-radius:7px; font-size:13.5px; font-family:var(--sans);
  }
  .field textarea{ resize:vertical; min-height:50px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .equip-picker{ border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-top:4px; }
  .equip-search{ padding:10px; border-bottom:1px solid var(--border); background:var(--panel-2); }
  .equip-search input{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; }
  .equip-list{ max-height:260px; overflow-y:auto; }
  .equip-cat{ font-size:10.5px; color:var(--muted); font-family:var(--mono); letter-spacing:.05em; padding:8px 12px 4px; text-transform:uppercase; }
  .equip-item{ display:flex; align-items:center; gap:10px; padding:7px 12px; font-size:13px; }
  .equip-item:hover{ background:var(--panel-2); }
  .equip-item input[type=checkbox]{ accent-color:var(--amber); width:15px; height:15px; flex-shrink:0; }
  .equip-item .name{ flex:1; }
  .equip-item .stock{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .equip-item .qty-input{
    width:48px; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:5px; padding:3px 4px; text-align:center; font-family:var(--mono); font-size:12px;
  }
  .equip-item.warn{ background:#241a16; }
  .equip-item .warn-text{ color:var(--red); font-size:10.5px; font-family:var(--mono); }

  .selected-strip{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{
    background:var(--amber-dim); color:var(--amber); border-radius:20px; padding:4px 10px;
    font-size:11.5px; font-family:var(--mono); display:flex; align-items:center; gap:6px;
  }
  .chip button{ background:none; border:none; color:var(--amber); cursor:pointer; font-size:13px; line-height:1; padding:0; }

  .conflict-box{
    background:#241a16; border:1px solid #4a2c2a; border-radius:8px; padding:10px 12px;
    font-size:12px; color:#f0a399; margin-top:12px; font-family:var(--mono); line-height:1.6;
  }
  .conflict-box .ok{ color:var(--green); }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }

  /* Availability tab */
  .avail-result{ margin-top:16px; }
  .avail-row{
    display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
    border-bottom:1px solid #25282f; font-size:13px;
  }
  .avail-row:last-child{ border-bottom:none; }
  .avail-free{ font-family:var(--mono); font-weight:700; }
  .avail-free.ok{ color:var(--green); }
  .avail-free.bad{ color:var(--red); }
  .avail-used-by{ font-size:11px; color:var(--muted); margin-top:2px; }

  .loading{ text-align:center; padding:40px; color:var(--muted); font-family:var(--mono); font-size:12px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#33363f; border-radius:10px; }

  @media (max-width:640px){
    .row2, .row3{ grid-template-columns:1fr; }
  }

  /* pakker */
  .pkg-card{ border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-bottom:8px; }
  .pkg-head{ display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; background:var(--panel-2); }
  .pkg-head:hover{ filter:brightness(1.1); }
  .pkg-badge{ font-size:10px; font-family:var(--mono); color:var(--muted); background:var(--panel); border:1px solid var(--border); padding:2px 7px; border-radius:10px; }
  .pkg-chevron{ font-size:11px; color:var(--muted); transition:transform .15s; margin-left:4px; }
  .pkg-chevron.open{ transform:rotate(90deg); }
  .pkg-body{ padding:10px 14px; border-top:1px solid var(--border); display:none; }
  .pkg-body.open{ display:block; }
  .pkg-item-row{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #252830; font-size:12.5px; }
  .pkg-item-row:last-child{ border-bottom:none; }
  .pkg-item-sn{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  /* kategorier */
  .cat-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #25282f; font-size:13px; }
  .cat-row:last-child{ border-bottom:none; }
  /* ob vogne */
  .ob-card{ border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .ob-head{ padding:16px 18px; display:flex; align-items:center; gap:12px; background:var(--panel-2); }
  .ob-badge{ width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff; flex-shrink:0; }
  .ob-booking-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 10px; background:var(--panel-2); border-radius:7px; margin-bottom:5px; font-size:12.5px; }
  .ob-booking-dates{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .ob-section{ padding:12px 18px; border-bottom:1px solid var(--border); }
  .ob-section:last-child{ border-bottom:none; }
  .ob-section-title{ font-size:10.5px; color:var(--muted); font-family:var(--mono); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .ob-tag{ font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:10px; font-weight:700; }

  /* ═══════════════════════════════════════
     MOBIL LAYOUT (max 640px)
     ═══════════════════════════════════════ */
  @media (max-width: 640px){

    /* App padding */
    .app{ padding:10px 10px 60px; }

    /* Header */
    header.top{ flex-wrap:wrap; gap:10px; padding:10px 0 12px; }
    header.top .btn{ padding:10px 14px; font-size:13px; }

    /* Nav tabs - horizontal scroll */
    nav.tabs{ overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; gap:0; padding-bottom:2px; }
    nav.tabs::-webkit-scrollbar{ height:0; }
    nav.tabs button{ font-size:12px; padding:10px 2px; margin-right:14px; white-space:nowrap; flex-shrink:0; }

    /* Filter bar - stack vertically */
    #tab-jobs > div:first-child{ flex-direction:column; align-items:stretch !important; }
    #tab-jobs > div:first-child input[type="date"],
    #tab-jobs > div:first-child input[type="text"],
    #tab-jobs > div:first-child button{ width:100%; }
    #tab-jobs > div:first-child .field{ width:100%; }

    /* Job cards */
    .job-head{ flex-wrap:wrap; gap:8px; padding:12px; }
    .job-title{ font-size:14px; }
    .job-meta{ font-size:11px; }
    .job-count, .job-conflict-badge{ font-size:10px; }
    .job-body{ padding:10px 12px; }
    .job-actions{ flex-wrap:wrap; gap:6px; }
    .job-actions .btn{ flex:1; min-width:calc(50% - 6px); text-align:center; padding:10px 8px; font-size:12px; }

    /* Modals - full screen on mobile */
    .overlay{ padding:0; align-items:flex-end; }
    .modal{
      border-radius:16px 16px 0 0;
      max-height:92vh;
      overflow-y:auto;
      padding:18px 14px;
      margin-bottom:0;
      width:100%;
      max-width:100%;
    }

    /* Grid fields - single column */
    .row2, .row3{ grid-template-columns:1fr !important; gap:10px; }

    /* Equip picker - taller */
    .equip-list{ max-height:200px; }

    /* Chips - wrap nicely */
    .selected-strip{ gap:5px; }
    .chip{ font-size:11px; padding:4px 8px; }

    /* Lager rows - stack actions */
    .equip-item{ flex-wrap:wrap; gap:6px; padding:8px 4px; }
    .equip-item .name{ font-size:13px; flex:1; min-width:60%; }
    .equip-item .stock{ font-size:11px; }
    .equip-item > div[style*="margin-left:auto"]{ margin-left:0 !important; width:100%; display:flex; flex-wrap:wrap; gap:5px; }
    .equip-item > div[style*="margin-left:auto"] select,
    .equip-item > div[style*="margin-left:auto"] button{ flex:1; min-width:calc(50% - 5px); font-size:11px; padding:7px 4px; }

    /* Package cards */
    .pkg-head{ padding:10px 10px; gap:8px; }
    .pkg-body{ padding:8px 10px; }
    .pkg-item-row{ flex-wrap:wrap; gap:5px; }
    .pkg-item-row select{ width:100%; }

    /* OB Vogne */
    .ob-head{ flex-wrap:wrap; gap:8px; padding:12px; }
    .ob-badge{ width:34px; height:34px; font-size:12px; }
    .ob-section{ padding:10px 12px; }
    .ob-booking-row{ flex-wrap:wrap; gap:6px; }
    .ob-booking-row > div:last-child{ width:100%; display:flex; flex-wrap:wrap; gap:5px; }
    .ob-booking-row > div:last-child button{ flex:1; font-size:11px; padding:8px 4px; }

    /* Stats summary - 2 columns */
    #statsSummary{ grid-template-columns:1fr 1fr !important; }

    /* Bulk bar */
    #bulkBar{ flex-direction:column; align-items:stretch; }
    #bulkBar select, #bulkBar button{ width:100%; padding:10px; font-size:13px; }

    /* Equip detail modal */
    #equipOverlay .modal > div:first-of-type{ flex-direction:column !important; }
    #equipImgPreview, #equipImgPlaceholder{ width:100% !important; height:160px !important; flex:none !important; }

    /* Category manager */
    .cat-row{ flex-wrap:wrap; gap:5px; }
    .cat-row button{ flex:1; }

    /* Bigger touch targets for all buttons */
    .btn{ min-height:40px; }
    .btn.small{ min-height:36px; padding:8px 10px; font-size:12px; }
  }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>Udstyr Booking</h1>
        <div class="sub">OB PULJE &middot; DELT LAGER</div>
      </div>
    </div>
    <button class="btn" id="newJobBtn">+ Nyt job</button>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="jobs">Puljeudstyr</button>
    <button data-tab="obvogne">OB Vogne</button>
    <button data-tab="avail">Tjek ledighed</button>
    <button data-tab="lager">Lager</button>
  </nav>

  <div id="tab-jobs">
    <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:12px 14px;">
      <div class="field" style="margin:0;"><label>Vis jobs fra</label><input type="date" id="filterStart" style="background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px;"></div>
      <div class="field" style="margin:0;"><label>til</label><input type="date" id="filterEnd" style="background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px;"></div>
      <button class="btn small secondary" id="filterResetBtn" style="margin-bottom:1px;">Nulstil</button>
      <button class="btn small secondary" id="ganttToggleBtn" style="margin-bottom:1px;">📅 Vis tidslinje</button>
      <input type="text" id="jobSearch" placeholder="Søg job navn, initialer..." style="min-width:220px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px;">
      <div id="filterCount" style="font-size:11px; color:var(--muted); font-family:var(--mono); align-self:center;"></div>
    </div>
    <div id="jobsGanttWrap" style="display:none; margin-bottom:14px;"></div>
    <div id="jobsLoading" class="loading">Henter bookinger...</div>
    <div id="jobsList"></div>
  </div>

  <div id="tab-avail" style="display:none;">
    <div class="panel">
      <div class="row3">
        <div class="field">
          <label>Udstyr</label>
          <div style="display:flex;gap:8px;">
          <input type="text" id="availSearch" placeholder="Søg udstyr..." style="flex:1;">
          <button class="btn small secondary" type="button" onclick="scanForAvailability()" style="white-space:nowrap;">📷 Scan</button>
        </div>
        </div>
        <div class="field">
          <label>Start dato</label>
          <input type="date" id="availStart">
        </div>
        <div class="field">
          <label>Slut dato</label>
          <input type="date" id="availEnd">
        </div>
      </div>
      <div id="availMatches" style="display:none;"></div>
      <div id="availResult" class="avail-result"></div>
    </div>
  </div>


  <div id="tab-lager" style="display:none;">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
        <div style="font-size:13px; font-weight:700;">Lager <span id="lagerCount" style="font-size:10px; color:var(--muted); font-family:var(--mono); font-weight:400;"></span></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="lagerSearch" placeholder="Søg..." style="min-width:180px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px;">
          <button class="btn small secondary" id="addPkgBtn">+ Ny pakke</button>
          <button class="btn small" id="addEquipBtn">+ Tilføj udstyr</button>
          <button class="btn small secondary" onclick="openCatManager()">Kategorier</button>
          <button class="btn small secondary" id="multiModeBtn" onclick="toggleMultiMode()">☑ Vælg flere</button>
          <button class="btn small secondary" id="showStatsBtn">Statistik</button>
        </div>
      </div>
      <div id="lagerNewRow" style="display:none; margin-bottom:14px;"></div>
      <div id="bulkBar" style="display:none; background:var(--panel-2); border:1px solid var(--amber); border-radius:8px; padding:10px 14px; margin-bottom:12px; gap:10px; align-items:center; flex-wrap:wrap;">
        <span id="bulkCount" style="font-size:12px; font-weight:700; color:var(--amber); font-family:var(--mono);"></span>
        <select id="bulkPkgSel" onchange="bulkMoveToPackage(this.value); this.value='';" style="background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:6px; font-size:12px;">
          <option value="">Flyt til pakke...</option>
        </select>
        <select id="bulkObSel" onchange="bulkMoveToOb(this.value); this.value='';" style="background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:6px; font-size:12px;">
          <option value="">OB Vogn...</option>
          <option value="__remove__">— Fjern fra OB vogn</option>
        </select>
        <select id="bulkCatSel" onchange="bulkChangeCategory(this.value); this.value='';" style="background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:6px; font-size:12px;">
          <option value="">Skift kategori...</option>
        </select>
        <button class="btn small danger" onclick="bulkDelete()">Slet valgte</button>
      </div>
      <div id="lagerList"></div>
    </div>
  </div>

  <div id="tab-stats" style="display:none;">
    <div class="panel" style="margin-bottom:14px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
        <div class="field" style="margin:0; min-width:120px;"><label>År</label><select id="statsYear" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;"></select></div>
        <div class="field" style="margin:0; min-width:180px;"><label>Kategori</label><select id="statsCat" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;"><option value="">Alle kategorier</option></select></div>
        <div class="field" style="margin:0; min-width:160px;"><label>Sorter efter</label><select id="statsSort" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px;"><option value="total">Mest brugt i alt</option><option value="name">Navn (A-Z)</option><option value="peak">Højeste enkelt måned</option></select></div>

// ── Helpers ──────────────────────────────────────────────────
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addMonths(d,n){ const dt=new Date(d+'T00:00:00'); dt.setMonth(dt.getMonth()+n); return dt.toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  return new Date(d+'T00:00:00').toLocaleDateString('da-DK',{day:'2-digit',month:'short',year:'numeric'});
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function datesOverlap(s1,e1,s2,e2){ return s1<=e2 && s2<=e1; }
function totalQty(name){ const it=EQUIPMENT.find(function(i){return i.name===name;}); return it?it.qty:1; }
function obVognById(id){ return OB_VOGNE.find(function(v){return v.id===id;}); }
function obBookingConflict(obVognId,start,end,excludeId){
  if(!obVognId||!start||!end) return null;
  return OB_BOOKINGER.find(function(b){
    if(b.id===excludeId) return false;
    if(b.ob_vogn_id!==obVognId) return false;
    return b.start_date<=end && b.end_date>=start;
  })||null;
}
function bookedQty(name,start,end,excludeJobId){
  let sum=0; const users=[];
  jobs.forEach(function(j){
    if(j.id===excludeJobId||!j.start||!j.end) return;
    if(!datesOverlap(start,end,j.start,j.end)) return;
    const f=(j.items||[]).find(function(it){return it.name===name;});
    if(f){ sum+=f.qty; users.push(j.name+' ('+f.qty+')'); }
  });
  return {sum,users};
}

    const el=document.getElementById(id); if(!el) return;
    const cur=el.value; el.innerHTML=opts; if(cur) el.value=cur;

function renderJobs(){
  const list=document.getElementById('jobsList');
  const loading=document.getElementById('jobsLoading');
  if(loading) loading.style.display='none';

  const fStart=document.getElementById('filterStart'); const fEnd=document.getElementById('filterEnd');
  const fs=fStart?fStart.value:''; const fe=fEnd?fEnd.value:'';
  const jobSearchEl=document.getElementById('jobSearch'); const jobQ=(jobSearchEl?jobSearchEl.value:'').trim().toLowerCase();
  const visible=jobs.filter(function(j){
    if(jobQ){
      return (j.name||'').toLowerCase().includes(jobQ) || (j.who||'').toLowerCase().includes(jobQ) || (j.notes||'').toLowerCase().includes(jobQ);
    }
    if(!j.start||!j.end) return true;
    if(fs && j.end<fs) return false;
    if(fe && j.start>fe) return false;
    return true;
  }).sort(function(a,b){ return (b.start||'').localeCompare(a.start||''); });

  const countEl=document.getElementById('filterCount');
  if(countEl) countEl.textContent=visible.length+' af '+jobs.length+' jobs';
  // gantt renders on demand

  if(jobs.length===0){ list.innerHTML='<div class="empty"><div class="big">📋</div>Ingen bookinger endnu.</div>'; return; }
  if(visible.length===0){ list.innerHTML='<div class="empty"><div class="big">🔍</div>Ingen jobs i den valgte periode.</div>'; return; }

  list.innerHTML='';
  visible.forEach(function(j){
    const itemCount=(j.items||[]).length;
    const totalQtyAll=(j.items||[]).reduce(function(s,i){return s+i.qty;},0);
    let conflictCount=0;
    (j.items||[]).forEach(function(it){
      if(it.isPkg) return;
      const bq=bookedQty(it.name,j.start,j.end,j.id);
      if(bq.sum+it.qty>totalQty(it.name)) conflictCount++;
    });

    const itemsHtml=(j.items||[]).map(function(it){
      const eq=EQUIPMENT.find(function(e){return e.name===it.name;});
      const isPkg=it.isPkg;
      return '<div class="item-row"><div><div>'+(isPkg?'📦 ':'')+escapeHtml(it.name)+'</div>'
        +(eq?'<div class="cat">'+escapeHtml(eq.category)+'</div>':'')
        +'</div><div class="item-qty">×'+it.qty+'</div></div>';
    }).join('')||'<div class="empty" style="padding:16px;">Intet udstyr tilføjet</div>';

    const card=document.createElement('div'); card.className='job-card'; card.dataset.id=j.id;
    const isTilbudJob=j.status==='tilbud';
    if(isTilbudJob) card.style.borderLeft='3px solid var(--amber)';
    card.innerHTML='<div class="job-head" onclick="toggleJob(\''+j.id+'\')">'
      +'<div><div class="job-title">'+(isTilbudJob?'<span style="background:#5c4521;color:var(--amber);font-size:9px;padding:1px 6px;border-radius:4px;font-family:var(--mono);font-weight:700;margin-right:5px;">TILBUD</span>':'')+escapeHtml(j.name||'(uden navn)')+(j.who?' · '+escapeHtml(j.who):'')+'</div>'
      +'<div class="job-meta">'+fmtDate(j.start)+' → '+fmtDate(j.end)+'</div></div>'
      +(conflictCount>0?'<div class="job-conflict-badge">⚠ '+conflictCount+' konflikt'+(conflictCount>1?'er':'')+'</div>'
        :'<div class="job-count">'+itemCount+' stk. · '+totalQtyAll+' i alt</div>')
      +'</div>'
      +'<div class="job-body" id="body-'+j.id+'">'
      +(j.notes?'<div class="notes">'+escapeHtml(j.notes)+'</div>':'')
      +itemsHtml
      +'<div class="job-actions">'
      +(isTilbudJob?'<button class="btn small" style="font-size:11px;background:var(--green);color:#0a1f14;" onclick="event.stopPropagation();convertJobToOrdre(\''+j.id+'\')">&#8594; Ordre</button>':'')
      +'<button class="btn small secondary" onclick="event.stopPropagation();openEdit(\''+j.id+'\')">Rediger</button>'
      +'<button class="btn small secondary" onclick="event.stopPropagation();openCopy(\''+j.id+'\')">Kopiér job</button>'
      +'<button class="btn small" onclick="event.stopPropagation();printPackList(\''+j.id+'\')" style="background:var(--panel-2);color:var(--amber);border:1px solid var(--amber-dim);">📄 Pakkeliste</button>'
      +'<button class="btn small danger" onclick="event.stopPropagation();deleteJob(\''+j.id+'\')">Slet</button>'
      +'</div></div>';
    list.appendChild(card);
  });
}

  const b=document.getElementById('body-'+id); if(b) b.classList.toggle('open');
}

function renderEquipList(filter){
  const container=document.getElementById('equipList');
  const f=filter.trim().toLowerCase();
  const start=document.getElementById('jobStart').value;
  const end=document.getElementById('jobEnd').value;

  const items=[];
  PACKAGES.forEach(function(pkg){ items.push({type:'pkg',obj:pkg,category:pkg.category,name:pkg.name}); });
  EQUIPMENT.filter(function(e){return !e.package_id;}).forEach(function(e){ items.push({type:'equip',obj:e,category:e.category,name:e.name}); });
  items.sort(function(a,b){ const c=a.category.localeCompare(b.category,'da'); return c!==0?c:a.name.localeCompare(b.name,'da'); });
  const filtered=items.filter(function(it){return !f||it.name.toLowerCase().includes(f)||it.category.toLowerCase().includes(f);});

  if(filtered.length===0){ container.innerHTML='<div class="empty" style="padding:20px;">Ingen match</div>'; return; }
  container.innerHTML=''; let lastCat=null;

  filtered.forEach(function(item){
    if(item.category!==lastCat){
      const cd=document.createElement('div'); cd.className='equip-cat'; cd.textContent=item.category;
      container.appendChild(cd); lastCat=item.category;
    }
    const key=item.type==='pkg'?'PKG:'+item.obj.id:item.obj.name;
    const checked=selectedItems.hasOwnProperty(key);
    const qty=checked?selectedItems[key]:1;
    const row=document.createElement('div'); row.className='equip-item';

    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=checked;
    cb.style.cssText='accent-color:var(--amber);width:15px;height:15px;flex-shrink:0;';
    cb.addEventListener('change',function(){
      if(cb.checked) selectedItems[key]=1; else delete selectedItems[key];
      renderEquipList(filter); renderSelectedStrip(); renderConflicts();
    });
    row.appendChild(cb);

    if(item.type==='pkg'){
      const pkg=item.obj;
      const contents=EQUIPMENT.filter(function(e){return e.package_id===pkg.id;});
      const ni=document.createElement('div'); ni.style.flex='1';
      const ne=document.createElement('div'); ne.className='name'; ne.textContent='📦 '+pkg.name;
      const sub=document.createElement('div'); sub.style.cssText='font-size:10px;color:var(--muted);';
      sub.textContent=contents.length+' stk.';
      ni.appendChild(ne); ni.appendChild(sub); row.appendChild(ni);
      const sv=document.createElement('div'); sv.className='stock'; sv.textContent='pakke'; row.appendChild(sv);
    } else {
      const equip=item.obj;
      // OB tag
      if(equip.ob_vogn_id){
        const v=obVognById(equip.ob_vogn_id);
        if(v){
          const tag=document.createElement('span'); tag.className='ob-tag';
          const conflict=start&&end?obBookingConflict(v.id,start,end,null):null;
          tag.style.cssText='background:'+v.color+'22;color:'+v.color+';border:1px solid '+v.color+'44;';
          tag.textContent=conflict?'🚐 '+v.name+' BOOKET':'🚐 '+v.name;
          row.appendChild(tag);
        }
      }
      const ne=document.createElement('div'); ne.className='name'; ne.textContent=equip.name; row.appendChild(ne);
      if(checked&&start&&end){
        const bq=bookedQty(equip.name,start,end,editingJobId);
        if(qty>equip.qty-bq.sum){ row.classList.add('warn'); const w=document.createElement('div'); w.className='warn-text'; w.textContent='kun '+Math.max(equip.qty-bq.sum,0)+' ledig'; row.appendChild(w); }
      }
      const sv=document.createElement('div'); sv.className='stock'; sv.textContent='af '+equip.qty; row.appendChild(sv);
    }
    if(checked){
      const qi=document.createElement('input'); qi.type='number'; qi.className='qty-input'; qi.min='1'; qi.value=qty;
      qi.addEventListener('change',function(){selectedItems[key]=parseInt(qi.value)||1; renderSelectedStrip(); renderConflicts(); renderEquipList(filter);});
      row.appendChild(qi);
    }
    container.appendChild(row);
  });
}

function renderSelectedStrip(){
  const strip=document.getElementById('selectedStrip');
  const names=Object.keys(selectedItems);
  if(!names.length){ strip.innerHTML=''; return; }
  strip.innerHTML='';
  names.forEach(function(n){
    const label=n.startsWith('PKG:')?(PACKAGES.find(function(p){return p.id===n.slice(4);})||{name:'pakke'}).name+' (pakke)':n;
    const chip=document.createElement('div'); chip.className='chip';
    chip.textContent=label+' ×'+selectedItems[n]+' ';
    const btn=document.createElement('button'); btn.textContent='×';
    btn.onclick=function(){ delete selectedItems[n]; renderSelectedStrip(); renderEquipList(document.getElementById('equipSearch').value||''); renderConflicts(); };
    chip.appendChild(btn); strip.appendChild(chip);
  });
}

function renderConflicts(){
  const box=document.getElementById('conflictBox');
  const start=document.getElementById('jobStart').value;
  const end=document.getElementById('jobEnd').value;
  if(!start||!end||!Object.keys(selectedItems).length){ box.innerHTML=''; return; }
  if(start>end){ box.innerHTML='<div class="conflict-box">Slut dato skal være efter start dato.</div>'; return; }
  const conflicts=[];
  Object.keys(selectedItems).forEach(function(n){
    if(n.startsWith('PKG:')) return;
    const qty=selectedItems[n];
    const bq=bookedQty(n,start,end,editingJobId);
    const free=totalQty(n)-bq.sum;
    if(qty>free) conflicts.push('⚠ '+n+': ønsker '+qty+', kun '+Math.max(free,0)+' ledige'+(bq.users.length?' ('+bq.users.join(', ')+')':''));
  });
  if(conflicts.length===0) box.innerHTML='<div class="conflict-box"><span class="ok">✓ Ingen konflikter.</span></div>';
  else box.innerHTML='<div class="conflict-box">'+conflicts.map(function(c){return escapeHtml(c);}).join('<br>')+'</div>';
}

function renderAvailMatches(filter){
  const box=document.getElementById('availMatches');
  const f=filter.trim().toLowerCase();
  if(!f){ box.style.display='none'; box.innerHTML=''; return; }
  const matches=[
    ...OB_VOGNE.filter(function(v){return v.name.toLowerCase().includes(f);}).map(function(v){return {name:'🚐 '+v.name, _name:v.name};}),
    ...PACKAGES.filter(function(p){return p.name.toLowerCase().includes(f);}).map(function(p){return {name:'📦 '+p.name, _name:p.name};}),
    ...EQUIPMENT.filter(function(e){return e.name.toLowerCase().includes(f);}).map(function(e){return {name:e.name, _name:e.name};})
  ].slice(0,12);
  if(!matches.length){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML='<div class="panel" style="margin-top:8px;padding:8px;">'
    +matches.map(function(m){ return '<div class="equip-item" style="cursor:pointer;" onclick="selectAvailItem(\''+m.name.replace(/'/g,"\\'")+'\')">'
      +'<div class="name">'+escapeHtml(m.name)+'</div></div>'; }).join('')+'</div>';
}
function selectAvailItem(name){
  // strip emoji prefix
  name = name.replace(/^[🚐📦] /, '');
  document.getElementById('availSearch').value=name;
  document.getElementById('availMatches').style.display='none';
  runAvailCheck();
}
function runAvailCheck(){
  const result=document.getElementById('availResult');
  const start=document.getElementById('availStart').value;
  const end=document.getElementById('availEnd').value;
  const q=document.getElementById('availSearch').value.trim();
  if(!q){ result.innerHTML=''; return; }

  const ql = q.toLowerCase();

  // Check packages too
  const pkg = PACKAGES.find(function(p){ return p.name.toLowerCase()===ql; })
           || PACKAGES.find(function(p){ return p.name.toLowerCase().includes(ql); });
  const eq  = EQUIPMENT.find(function(i){ return i.name.toLowerCase()===ql; })
           || EQUIPMENT.find(function(i){ return i.name.toLowerCase().includes(ql); });
  // Also match OB Vogn by name
  const vogn = OB_VOGNE.find(function(v){ return v.name.toLowerCase()===ql; })
            || OB_VOGNE.find(function(v){ return v.name.toLowerCase().includes(ql); });

  if(!eq && !pkg && !vogn){ result.innerHTML='<div class="empty">Intet matcher "'+escapeHtml(q)+'"</div>'; return; }

  var html = '';

  // ── OB Vogn match ──
  if(vogn){
    if(!start||!end){
      html += '<div class="avail-row"><div><div style="font-weight:700;">🚐 '+escapeHtml(vogn.name)+'</div></div><div class="avail-free">Vælg datoer</div></div>';
    } else {
      const obB = obBookingConflict(vogn.id, start, end, null);
      html += '<div class="avail-row"><div>'
        +'<div style="font-weight:700;">🚐 '+escapeHtml(vogn.name)+'</div>'
        +(obB?'<div class="avail-used-by">Booket: '+escapeHtml(obB.name)+(obB.who?' ('+escapeHtml(obB.who)+')':'')+' '+fmtDate(obB.start_date)+' → '+fmtDate(obB.end_date)+'</div>':'')
        +'</div><div class="avail-free '+(obB?'bad':'ok')+'">'+(obB?'Booket':'Ledig')+'</div></div>';
    }
  }

  // ── Equipment match ──
  if(eq){
    if(!start||!end){
      html += '<div class="avail-row"><div>'+escapeHtml(eq.name)+'</div><div class="avail-free">'+eq.qty+' stk. — vælg datoer</div></div>';
    } else {
      const bq = bookedQty(eq.name, start, end, null);
      const free = eq.qty - bq.sum;
      // Also check if in an OB vogn that is booked
      var obWarn = '';
      if(eq.ob_vogn_id){
        const obB = obBookingConflict(eq.ob_vogn_id, start, end, null);
        if(obB){
          const v = obVognById(eq.ob_vogn_id);
          obWarn = '<div class="avail-used-by" style="color:var(--amber);">OB booket via 🚐 '+(v?escapeHtml(v.name):'?')+': '+escapeHtml(obB.name)+' '+fmtDate(obB.start_date)+' → '+fmtDate(obB.end_date)+'</div>';
        }
      }
      html += '<div class="avail-row"><div><div>'+escapeHtml(eq.name)+'</div>'
        +(bq.users.length?'<div class="avail-used-by">Pulje booket: '+escapeHtml(bq.users.join(', '))+'</div>':'')
        +obWarn
        +'</div><div class="avail-free '+(free>0&&!obWarn?'ok':'bad')+'">'+free+' / '+eq.qty+' ledige</div></div>';
    }
  }

  // ── Package match ──
  if(pkg && pkg !== eq){
    if(!start||!end){
      html += '<div class="avail-row"><div>📦 '+escapeHtml(pkg.name)+'</div><div class="avail-free">Vælg datoer</div></div>';
    } else {
      var obWarnP = '';
      if(pkg.ob_vogn_id){
        const obB = obBookingConflict(pkg.ob_vogn_id, start, end, null);
        if(obB){
          const v = obVognById(pkg.ob_vogn_id);
          obWarnP = '<div class="avail-used-by" style="color:var(--amber);">OB booket via 🚐 '+(v?escapeHtml(v.name):'?')+': '+escapeHtml(obB.name)+'</div>';
        }
      }
      html += '<div class="avail-row"><div><div>📦 '+escapeHtml(pkg.name)+'</div>'
        +obWarnP
        +'</div><div class="avail-free '+(obWarnP?'bad':'ok')+'">'+(obWarnP?'Booket':'Ledig')+'</div></div>';
    }
  }

  result.innerHTML = html || '<div class="empty">Ingen resultater</div>';
}

// LAGER (unified equipment + packages list)
// ═══════════════════════════════════════════════════════════
function togglePkg(id){
  const b=document.getElementById('pkgbody-'+id); if(b) b.classList.toggle('open');
  const c=document.getElementById('chev-'+id); if(c) c.classList.toggle('open');
}

function renderLager(filter){
  const list=document.getElementById('lagerList');
  const countEl=document.getElementById('lagerCount');
  const f=(filter||'').trim().toLowerCase();

  const items=[];
  PACKAGES.forEach(function(pkg){ items.push({type:'pkg',obj:pkg,category:pkg.category,name:pkg.name}); });
  EQUIPMENT.filter(function(e){return !e.package_id;}).forEach(function(e){ items.push({type:'equip',obj:e,category:e.category,name:e.name}); });
  items.sort(function(a,b){ const c=a.category.localeCompare(b.category,'da'); return c!==0?c:a.name.localeCompare(b.name,'da'); });
  const filtered=items.filter(function(it){return !f||it.name.toLowerCase().includes(f)||it.category.toLowerCase().includes(f);});

  const total=PACKAGES.length+EQUIPMENT.filter(function(e){return !e.package_id;}).length;
  if(multiMode && EQUIPMENT.filter(function(e){return !e.package_id;}).length>0){
    const saRow=document.createElement('div'); saRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted);';
    const saCb=document.createElement('input'); saCb.type='checkbox'; saCb.style.cssText='accent-color:var(--amber);width:15px;height:15px;';
    const loose=EQUIPMENT.filter(function(e){return !e.package_id;});
    saCb.checked=loose.every(function(e){return multiSelected.has(e.id);});
    saCb.addEventListener('change',function(){selectAll(saCb.checked);});
    const saLbl=document.createElement('span'); saLbl.textContent='Vælg alle løse udstyr';
    saRow.appendChild(saCb); saRow.appendChild(saLbl);
    list.appendChild(saRow);
  }
  if(countEl) countEl.textContent=filtered.length+' af '+total+' ('+PACKAGES.length+' pakker, '+EQUIPMENT.filter(function(e){return !e.package_id;}).length+' udstyr)';

  list.innerHTML=''; let lastCat=null;

  // Update bulk selects
  const bps=document.getElementById('bulkPkgSel');
  if(bps){ bps.innerHTML='<option value="">Flyt til pakke...</option>'+PACKAGES.map(function(p){return '<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>';}).join(''); }
  const bos=document.getElementById('bulkObSel');
  if(bos){ bos.innerHTML='<option value="">OB Vogn...</option><option value="__remove__">— Fjern fra OB vogn</option>'+OB_VOGNE.map(function(v){return '<option value="'+v.id+'">🚐 '+escapeHtml(v.name)+'</option>';}).join(''); }
  const bcs=document.getElementById('bulkCatSel');
  if(bcs){ bcs.innerHTML='<option value="">Skift kategori...</option>'+CATEGORIES.map(function(c){return '<option value="'+escapeHtml(c.name)+'">'+escapeHtml(c.name)+'</option>';}).join(''); }
  updateBulkBar();

  filtered.forEach(function(item){
    if(item.category!==lastCat){
      const cd=document.createElement('div'); cd.className='equip-cat'; cd.textContent=item.category;
      list.appendChild(cd); lastCat=item.category;
    }
    if(item.type==='pkg'){
      const pkg=item.obj;
      const contents=EQUIPMENT.filter(function(e){return e.package_id===pkg.id;});
      const card=document.createElement('div'); card.className='pkg-card'; card.style.marginBottom='6px';
      const head=document.createElement('div'); head.className='pkg-head'; head.style.borderRadius='8px';
      head.innerHTML=(pkg.image_url?'<img src="'+escapeHtml(pkg.image_url)+'" style="width:28px;height:28px;border-radius:4px;object-fit:cover;flex-shrink:0;">':'')
        +'<span style="font-size:15px;flex-shrink:0;">📦</span>'
        +'<div style="flex:1;"><div style="font-weight:700;font-size:13.5px;">'+escapeHtml(pkg.name)+'</div>'
        +'<div style="font-size:10.5px;color:var(--muted);">'+contents.length+' stk.'+(pkg.tv2_number?' · TV2: '+escapeHtml(pkg.tv2_number):'')+'</div></div>'
        +'<span class="pkg-badge">'+contents.length+' stk.</span>';

      const bEdit=document.createElement('button'); bEdit.className='btn small secondary'; bEdit.textContent='Rediger'; bEdit.style.fontSize='11px';
      bEdit.addEventListener('click', function(e){ e.stopPropagation(); openPkgDetail(pkg.id); }); head.appendChild(bEdit);
      const bCopyPkg=document.createElement('button'); bCopyPkg.className='btn small secondary'; bCopyPkg.textContent='Kopier'; bCopyPkg.style.fontSize='11px';
      (function(pid){ bCopyPkg.addEventListener('click', function(e){ e.stopPropagation(); copyPkg(pid); }); })(pkg.id); head.appendChild(bCopyPkg);

      const bDel=document.createElement('button'); bDel.className='btn small danger'; bDel.textContent='Slet'; bDel.style.fontSize='11px';
      bDel.addEventListener('click', function(e){ e.stopPropagation();
        const cnt=EQUIPMENT.filter(function(x){return x.package_id===pkg.id;}).length;
        if(!confirm('Slet "'+pkg.name+'"?'+(cnt>0?'\n'+cnt+' stykker flyttes til løst lager.':''))) return;
        deletePackage(pkg.id).then(function(){ renderLager(document.getElementById('lagerSearch').value||''); });
      }); head.appendChild(bDel);

      // OB vogn dropdown
      if(OB_VOGNE.length>0){
        const obSel=document.createElement('select'); obSel.className='btn small secondary'; obSel.style.cssText='font-size:11px;padding:3px 6px;';
        const cur=pkg.ob_vogn_id?obVognById(pkg.ob_vogn_id):null;
        obSel.innerHTML='<option value="">'+(cur?'🚐 '+cur.name:'— Pulje')+'</option>'
          +(pkg.ob_vogn_id?'<option value="__remove__">Fjern fra OB</option>':'')
          +OB_VOGNE.filter(function(v){return v.id!==pkg.ob_vogn_id;}).map(function(v){return '<option value="'+v.id+'">🚐 '+escapeHtml(v.name)+'</option>';}).join('');
        if(cur){ obSel.style.color=cur.color; obSel.style.borderColor=cur.color; }
        obSel.addEventListener('change', async function(){
          if(!obSel.value) return; obSel.disabled=true;
          await supa.from('packages').update({ob_vogn_id:obSel.value==='__remove__'?null:obSel.value}).eq('id',pkg.id);
          await loadPackages(); renderLager(document.getElementById('lagerSearch').value||'');
        }); head.appendChild(obSel);
      }

      const chev=document.createElement('span'); chev.className='pkg-chevron'; chev.id='chev-'+pkg.id; chev.innerHTML='&#9654;'; head.appendChild(chev);
      head.addEventListener('click', function(){ togglePkg(pkg.id); });
      card.appendChild(head);

      const body=document.createElement('div'); body.className='pkg-body'; body.id='pkgbody-'+pkg.id;
      if(contents.length===0){ body.innerHTML='<div style="font-size:11.5px;color:var(--muted);padding:6px 0;">Tom pakke</div>'; }
      else{
        contents.forEach(function(it){
          const row=document.createElement('div'); row.className='pkg-item-row';
          const nd=document.createElement('div');
          nd.innerHTML='<div>'+escapeHtml(it.name)+'</div>'+([it.serial_number?'SN: '+it.serial_number:'',it.tv2_number?'TV2: '+it.tv2_number:''].filter(Boolean).length?'<div class="pkg-item-sn">'+escapeHtml([it.serial_number?'SN: '+it.serial_number:'',it.tv2_number?'TV2: '+it.tv2_number:''].filter(Boolean).join(' · '))+'</div>':'');
          row.appendChild(nd);
          const sel=document.createElement('select'); sel.className='btn small secondary'; sel.style.cssText='font-size:11px;padding:3px 5px;margin-left:auto;';
          sel.innerHTML='<option value="'+pkg.id+'">— I denne pakke</option><option value="">Flyt til løst udstyr</option>'
            +PACKAGES.filter(function(p){return p.id!==pkg.id;}).map(function(p){return '<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>';}).join('');
          sel.addEventListener('change', async function(){ sel.disabled=true; await moveEquipToPackage(it.id,sel.value||null); renderLager(document.getElementById('lagerSearch').value||''); });
          row.appendChild(sel); body.appendChild(row);
        });
      }
      const loose=EQUIPMENT.filter(function(e){return !e.package_id;});
      if(loose.length>0){
        const asel=document.createElement('select'); asel.className='btn small secondary'; asel.style.cssText='font-size:11px;margin-top:8px;';
        asel.innerHTML='<option value="">+ Tilføj løst udstyr</option>'+loose.map(function(e){return '<option value="'+e.id+'">'+escapeHtml(e.name)+'</option>';}).join('');
        asel.addEventListener('change', async function(){ if(!asel.value) return; await moveEquipToPackage(asel.value,pkg.id); renderLager(document.getElementById('lagerSearch').value||''); document.getElementById('pkgbody-'+pkg.id).classList.add('open'); const c=document.getElementById('chev-'+pkg.id); if(c) c.classList.add('open'); });
        body.appendChild(asel);
      }
      card.appendChild(body); list.appendChild(card);

    } else {
      const equip=item.obj;
      const realIdx=EQUIPMENT.indexOf(equip);
      const row=document.createElement('div'); row.className='equip-item';
      if(equip.image_url){ const img=document.createElement('img'); img.src=equip.image_url; img.style.cssText='width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0;'; row.appendChild(img); }
      const ne=document.createElement('div'); ne.className='name'; ne.textContent=equip.name; row.appendChild(ne);
      const sv=document.createElement('div'); sv.className='stock'; sv.textContent=equip.qty+' stk.'; row.appendChild(sv);
      const actions=document.createElement('div'); actions.style.cssText='margin-left:auto;display:flex;gap:5px;align-items:center;';
      // Move to package
      if(PACKAGES.length>0){
        const ms=document.createElement('select'); ms.className='btn small secondary'; ms.style.cssText='font-size:11px;padding:4px 6px;';
        ms.innerHTML='<option value="">Flyt til pakke...</option>'+PACKAGES.map(function(p){return '<option value="'+p.id+'">📦 '+escapeHtml(p.name)+'</option>';}).join('');
        ms.addEventListener('change', async function(){ if(!ms.value) return; ms.disabled=true; await moveEquipToPackage(equip.id,ms.value); renderLager(document.getElementById('lagerSearch').value||''); });
        actions.appendChild(ms);
      }
      // OB vogn
      if(OB_VOGNE.length>0){
        const ov=document.createElement('select'); ov.className='btn small secondary'; ov.style.cssText='font-size:11px;padding:4px 6px;';
        const cur=equip.ob_vogn_id?obVognById(equip.ob_vogn_id):null;
        ov.innerHTML='<option value="">'+(cur?'🚐 '+cur.name:'OB Vogn...')+'</option>'
          +(equip.ob_vogn_id?'<option value="__remove__">Fjern fra OB</option>':'')
          +OB_VOGNE.filter(function(v){return v.id!==equip.ob_vogn_id;}).map(function(v){return '<option value="'+v.id+'">🚐 '+escapeHtml(v.name)+'</option>';}).join('');
        if(cur){ ov.style.color=cur.color; ov.style.borderColor=cur.color; }
        ov.addEventListener('change', async function(){ if(!ov.value) return; ov.disabled=true; await supa.from('equipment').update({ob_vogn_id:ov.value==='__remove__'?null:ov.value}).eq('id',equip.id); await loadEquipment(); renderLager(document.getElementById('lagerSearch').value||''); });
        actions.appendChild(ov);
      }
      // Multi-select checkbox
      if(multiMode){
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=multiSelected.has(equip.id);
        cb.style.cssText='accent-color:var(--amber);width:16px;height:16px;flex-shrink:0;cursor:pointer;';
        (function(eid){ cb.addEventListener('change',function(){ toggleMultiSelect(eid); }); })(equip.id);
        row.insertBefore(cb, row.firstChild);
      }
      const bd=document.createElement('button'); bd.className='btn small secondary'; bd.textContent='Detaljer'; bd.addEventListener('click', function(){ openEquipDetail(realIdx); }); actions.appendChild(bd);
      const br=document.createElement('button'); br.className='btn small secondary'; br.textContent='Rediger'; br.addEventListener('click', function(){ openEquipDetail(realIdx); }); actions.appendChild(br);
      const bcp=document.createElement('button'); bcp.className='btn small secondary'; bcp.textContent='Kopier'; (function(ri){ bcp.addEventListener('click', function(){ copyEquip(ri); }); })(realIdx); actions.appendChild(bcp);
      const bx=document.createElement('button'); bx.className='btn small danger'; bx.textContent='Slet'; bx.addEventListener('click', function(){ deleteEquip(realIdx); }); actions.appendChild(bx);
      row.appendChild(actions); list.appendChild(row);
    }
  });
}

async function confirmAddEquip(){
  const name=document.getElementById('newEquipName').value.trim();
  const category=document.getElementById('newEquipCat').value||'Diverse';
  let qty=parseInt(document.getElementById('newEquipQty').value); if(isNaN(qty)||qty<0) qty=0;
  if(!name){ alert('Skriv et navn.'); return; }
  if(EQUIPMENT.some(function(e){return e.name.toLowerCase()===name.toLowerCase();})){alert('Findes allerede.');return;}
  const {error}=await supa.from('equipment').insert({name,category,qty});
  if(error){ alert('Fejl: '+error.message); return; }
  await loadEquipment();
  document.getElementById('lagerNewRow').style.display='none';
  renderLager(document.getElementById('lagerSearch').value||'');
}
async function saveEquipEdit(idx){
  const it=EQUIPMENT[idx];
  const name=document.getElementById('editName_'+idx).value.trim();
  const category=document.getElementById('editCat_'+idx).value.trim()||'Diverse';
  let qty=parseInt(document.getElementById('editQty_'+idx).value); if(isNaN(qty)||qty<0) qty=0;
  if(!name){ alert('Navn må ikke være tomt.'); return; }
  const {error}=await supa.from('equipment').update({name,category,qty}).eq('id',it.id);
  if(error){ alert('Fejl: '+error.message); return; }
  await loadEquipment(); editingEquipName=null; renderLager(document.getElementById('lagerSearch').value||''); renderJobs();
}
async function deleteEquip(idx){
  const it=EQUIPMENT[idx];
  if(!confirm('Slet "'+it.name+'"?')) return;
  await supa.from('equipment').delete().eq('id',it.id);
  await loadEquipment(); renderLager(document.getElementById('lagerSearch').value||'');
}

const equipOverlay=document.getElementById('equipOverlay');
function openEquipDetail(idx){
  const it=EQUIPMENT[idx]; if(!it) return;
  detailCurrentIdx=idx; detailPendingFile=null; editingPkgId=null;
  document.getElementById('equipDetailTitle').textContent='Detaljer: '+it.name;
  document.getElementById('dName').value=it.name||'';
  document.getElementById('dQty').value=it.qty||0;
  document.getElementById('dTv2').value=it.tv2_number||'';
  document.getElementById('dSerial').value=it.serial_number||'';
  var qrEl=document.getElementById('dQrCode'); if(qrEl) qrEl.value=it.qr_code||'';
  document.getElementById('dPower').value=it.power_connection||'';
  document.getElementById('equipImgFile').value='';
  document.getElementById('equipImgStatus').textContent='';
  const pv=document.getElementById('equipImgPreview'); const ph=document.getElementById('equipImgPlaceholder');
  if(it.image_url){pv.src=it.image_url;pv.style.display='block';ph.style.display='none';}
  else{pv.style.display='none';ph.style.display='flex';}
  detailCustomFields=(it.custom_fields&&it.custom_fields.length)?it.custom_fields.map(function(f){return{...f};}):[];
  renderCustomFields(); populateCategoryDropdowns();
  const cs=document.getElementById('dCategory'); if(cs) cs.value=it.category||'Diverse';
  document.getElementById('equipDetailSaveBtn').dataset.mode='equipment';
  equipOverlay.classList.add('open');
}
function renderCustomFields(){
  const c=document.getElementById('customFieldsList');
  if(!detailCustomFields.length){ c.innerHTML='<div style="font-size:11.5px;color:var(--muted);">Ingen ekstra felter.</div>'; return; }
  c.innerHTML='';
  detailCustomFields.forEach(function(f,i){
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;margin-bottom:6px;';
    const l=document.createElement('input'); l.type='text'; l.placeholder='Feltnavn'; l.value=f.label; l.style.cssText='width:140px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-size:12.5px;';
    l.addEventListener('change',function(){detailCustomFields[i].label=l.value;});
    const v=document.createElement('input'); v.type='text'; v.placeholder='Værdi'; v.value=f.value; v.style.cssText='flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-size:12.5px;';
    v.addEventListener('change',function(){detailCustomFields[i].value=v.value;});
    const btn=document.createElement('button'); btn.className='btn small danger'; btn.textContent='×';
    btn.addEventListener('click',function(){detailCustomFields.splice(i,1);renderCustomFields();});
    row.appendChild(l); row.appendChild(v); row.appendChild(btn); c.appendChild(row);
  });
}
document.getElementById('addCustomFieldBtn').addEventListener('click', function(){ detailCustomFields.push({label:'',value:''}); renderCustomFields(); });
document.getElementById('equipImgFile').addEventListener('change', function(e){
  const file=e.target.files[0]; if(!file) return; detailPendingFile=file;
  const reader=new FileReader(); reader.onload=function(){
    const pv=document.getElementById('equipImgPreview'); pv.src=reader.result; pv.style.display='block';
    document.getElementById('equipImgPlaceholder').style.display='none';
  }; reader.readAsDataURL(file);
});
document.getElementById('equipDetailCancelBtn').addEventListener('click', function(){ equipOverlay.classList.remove('open'); });
equipOverlay.addEventListener('click', function(e){ if(e.target===equipOverlay) equipOverlay.classList.remove('open'); });

document.getElementById('equipDetailSaveBtn').addEventListener('click', async function(){
  const mode=document.getElementById('equipDetailSaveBtn').dataset.mode;
  if(mode==='package'){ await savePkgFromOverlay(); return; }
  const it=EQUIPMENT[detailCurrentIdx]; if(!it) return;
  const btn=document.getElementById('equipDetailSaveBtn'); btn.disabled=true; btn.textContent='Gemmer...';
  try{
    let image_url=it.image_url||null;
    if(detailPendingFile){
      const ext=detailPendingFile.name.split('.').pop();
      const path='equip_'+it.id+'_'+Date.now()+'.'+ext;
      const {error:ue}=await supa.storage.from('udstyr-billeder').upload(path,detailPendingFile,{upsert:true});
      if(!ue){ const {data:pub}=supa.storage.from('udstyr-billeder').getPublicUrl(path); image_url=pub.publicUrl; }
    }
    const name=document.getElementById('dName').value.trim();
    const category=document.getElementById('dCategory').value||'Diverse';
    let qty=parseInt(document.getElementById('dQty').value); if(isNaN(qty)||qty<0) qty=0;
    const custom_fields=detailCustomFields.filter(function(f){return f.label.trim()||f.value.trim();});
    const {error}=await supa.from('equipment').update({name,category,qty,tv2_number:document.getElementById('dTv2').value.trim(),serial_number:document.getElementById('dSerial').value.trim(),qr_code:(document.getElementById('dQrCode').value.trim()||null),power_connection:document.getElementById('dPower').value.trim(),image_url,custom_fields}).eq('id',it.id);
    if(error) throw error;
    await loadEquipment(); equipOverlay.classList.remove('open'); renderLager(document.getElementById('lagerSearch').value||''); renderJobs();
  }catch(e){ console.error(e); alert('Fejl: '+(e.message||JSON.stringify(e))); }
  finally{ btn.disabled=false; btn.textContent='Gem detaljer'; }
});

// ── Package detail (reuses equip overlay) ─────────────────
function openPkgDetail(id){
  const pkg=id?PACKAGES.find(function(p){return p.id===id;}):null;
  editingPkgId=id||null; detailCurrentIdx=null; detailPendingFile=null;
  document.getElementById('equipDetailTitle').textContent=pkg?'Rediger pakke: '+pkg.name:'Ny pakke';
  document.getElementById('dName').value=pkg?pkg.name:'';
  document.getElementById('dQty').value=pkg?pkg.qty:1;
  document.getElementById('dTv2').value=pkg?(pkg.tv2_number||''):'';
  document.getElementById('dSerial').value=pkg?(pkg.serial_number||''):'';
  var qrEl2=document.getElementById('dQrCode'); if(qrEl2) qrEl2.value=pkg?(pkg.qr_code||''):'';
  document.getElementById('dPower').value=pkg?(pkg.power_connection||''):'';
  document.getElementById('equipImgFile').value='';
  document.getElementById('equipImgStatus').textContent='';
  const pv=document.getElementById('equipImgPreview'); const ph=document.getElementById('equipImgPlaceholder');
  if(pkg&&pkg.image_url){pv.src=pkg.image_url;pv.style.display='block';ph.style.display='none';}
  else{pv.style.display='none';ph.style.display='flex';}
  detailCustomFields=(pkg&&pkg.custom_fields)?pkg.custom_fields.map(function(f){return{...f};}):[];
  renderCustomFields(); populateCategoryDropdowns();
  const cs=document.getElementById('dCategory'); if(cs) cs.value=pkg?pkg.category:'Diverse';
  document.getElementById('equipDetailSaveBtn').dataset.mode='package';
  equipOverlay.classList.add('open');
}
async function savePkgFromOverlay(){
  const btn=document.getElementById('equipDetailSaveBtn'); btn.disabled=true; btn.textContent='Gemmer...';
  try{
    const name=document.getElementById('dName').value.trim();
    const category=document.getElementById('dCategory').value||'Diverse';
    let qty=parseInt(document.getElementById('dQty').value); if(isNaN(qty)||qty<1) qty=1;
    if(!name){ alert('Skriv et navn.'); btn.disabled=false; btn.textContent='Gem detaljer'; return; }
    const existing=editingPkgId?PACKAGES.find(function(p){return p.id===editingPkgId;}):null;
    let image_url=existing?(existing.image_url||null):null;
    if(detailPendingFile){
      const ext=detailPendingFile.name.split('.').pop();
      const path='pkg_'+(editingPkgId||Date.now())+'_'+Date.now()+'.'+ext;
      const {error:ue}=await supa.storage.from('udstyr-billeder').upload(path,detailPendingFile,{upsert:true});
      if(!ue){ const {data:pub}=supa.storage.from('udstyr-billeder').getPublicUrl(path); image_url=pub.publicUrl; }
    }
    const row={name,category,qty,tv2_number:document.getElementById('dTv2').value.trim(),serial_number:document.getElementById('dSerial').value.trim(),qr_code:(document.getElementById('dQrCode').value.trim()||null),power_connection:document.getElementById('dPower').value.trim(),image_url,custom_fields:detailCustomFields.filter(function(f){return f.label.trim()||f.value.trim();})};
    if(editingPkgId){ const {error}=await supa.from('packages').update(row).eq('id',editingPkgId); if(error) throw error; }
    else { const {error}=await supa.from('packages').insert(row); if(error) throw error; }
    await loadPackages(); equipOverlay.classList.remove('open'); renderLager(document.getElementById('lagerSearch').value||'');

}

// ═══════════════════════════════════════════════════════════
const MONTHS_DA=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
function bookedDaysInMonth(job,year,month){
  if(!job.start||!job.end) return 0;
  const ms=new Date(year,month,1),me=new Date(year,month+1,0);
  const js=new Date(job.start+'T00:00:00'),je=new Date(job.end+'T00:00:00');
  const os=js>ms?js:ms,oe=je<me?je:me;
  if(oe<os) return 0;
  return Math.round((oe-os)/(1000*60*60*24))+1;
}
function initStatsControls(){
  const years=new Set([new Date().getFullYear(),new Date().getFullYear()-1]);
  jobs.forEach(function(j){if(j.start) years.add(parseInt(j.start.slice(0,4)));});
  const ys=document.getElementById('statsYear');
  ys.innerHTML=[...years].sort(function(a,b){return b-a;}).map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('');
}
function renderStats(){ initStatsControls(); computeAndRenderStats(); }
function computeAndRenderStats(){
  const year=parseInt(document.getElementById('statsYear').value);
  const catFilter=document.getElementById('statsCat').value;
  const sort=document.getElementById('statsSort').value;
  const metric=document.getElementById('statsMetric').value;
  let equipment=EQUIPMENT; if(catFilter) equipment=equipment.filter(function(e){return e.category===catFilter;});
  const itemMap={};
  equipment.forEach(function(eq){ itemMap[eq.name]={name:eq.name,cat:eq.category,monthly:Array(12).fill(0),total:0,peak:0}; });
  jobs.forEach(function(job){
    if(!job.start) return;
    const jy=parseInt(job.start.slice(0,4)),ey=job.end?parseInt(job.end.slice(0,4)):jy;
    if(jy>year||ey<year) return;
    (job.items||[]).forEach(function(it){
      if(!itemMap[it.name]) return;
      for(let m=0;m<12;m++){
        let val=metric==='days'?bookedDaysInMonth(job,year,m)*it.qty:0;
        if(metric==='jobs'){ const ms=new Date(year,m,1),me=new Date(year,m+1,0),js=new Date(job.start+'T00:00:00'),je=job.end?new Date(job.end+'T00:00:00'):js; if(js<=me&&je>=ms) val=1; }
        itemMap[it.name].monthly[m]+=val; itemMap[it.name].total+=val;
      }
    });
  });
  Object.values(itemMap).forEach(function(it){it.peak=Math.max(...it.monthly);});
  let items=Object.values(itemMap).filter(function(it){return it.total>0;});
  if(sort==='total') items.sort(function(a,b){return b.total-a.total;});
  else if(sort==='name') items.sort(function(a,b){return a.name.localeCompare(b.name);});
  else items.sort(function(a,b){return b.peak-a.peak;});
  const totalDays=items.reduce(function(s,i){return s+i.total;},0);
  const topItem=items[0];
  const byMonth=Array(12).fill(0); items.forEach(function(it){it.monthly.forEach(function(v,m){byMonth[m]+=v;});});
  const maxMonth=Math.max(...byMonth);
  const peakM=byMonth.indexOf(maxMonth);
  document.getElementById('statsSummary').innerHTML=[
    {label:metric==='days'?'Totale lejedage':'Totale job-bookinger',val:totalDays.toLocaleString('da-DK')},
    {label:'Aktive stykker udstyr',val:items.length},
    {label:'Mest brugte udstyr',val:topItem?topItem.name.slice(0,28)+(topItem.name.length>28?'…':''):'—'},
    {label:'Travleste måned',val:maxMonth>0?MONTHS_DA[peakM]+' ('+maxMonth+')':'—'}
  ].map(function(s){return '<div class="panel" style="padding:12px 14px;"><div style="font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">'+s.label+'</div><div style="font-size:16px;font-weight:800;color:var(--amber);">'+escapeHtml(String(s.val))+'</div></div>';}).join('');
  if(!items.length){ document.getElementById('statsContent').innerHTML='<div class="empty">Ingen bookinger i '+year+'</div>'; return; }
  const gMax=Math.max(...items.flatMap(function(i){return i.monthly;}),1);
  const ml=metric==='days'?'dage':'jobs';
  document.getElementById('statsContent').innerHTML='<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px;">'+items.length+' stykker udstyr med bookinger i '+year+'</div>'
    +items.map(function(it){
      const bars=it.monthly.map(function(v,m){const pct=Math.round((v/gMax)*100); return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;"><div style="font-size:8px;color:'+(v>0?'var(--amber)':'var(--muted)')+';">'+(v>0?v:'')+'</div><div style="width:100%;background:var(--border);border-radius:2px;height:28px;display:flex;align-items:flex-end;"><div style="width:100%;height:'+pct+'%;background:'+(pct>66?'var(--amber)':pct>33?'#b07d2a':'#5c4521')+';border-radius:2px;min-height:'+(v>0?2:0)+'px;"></div></div><div style="font-size:7.5px;color:var(--muted);font-family:var(--mono);">'+MONTHS_DA[m]+'</div></div>';}).join('');
      return '<div style="background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;"><div><div style="font-size:13px;font-weight:700;">'+escapeHtml(it.name)+'</div><div style="font-size:10px;color:var(--muted);font-family:var(--mono);">'+escapeHtml(it.cat)+'</div></div><div style="text-align:right;flex-shrink:0;"><div style="font-size:16px;font-weight:800;color:var(--amber);font-family:var(--mono);">'+it.total+'</div><div style="font-size:9px;color:var(--muted);">'+ml+' i '+year+'</div></div></div><div style="display:flex;gap:3px;align-items:flex-end;height:58px;">'+bars+'</div></div>';
    }).join('');
}
document.getElementById('statsExportBtn').addEventListener('click', function(){
  const year=parseInt(document.getElementById('statsYear').value);
  const header=['Udstyr','Kategori',...MONTHS_DA.map(function(m){return m+' '+year;}),'Total'].join(';');
  const rows=Object.values((function(){const m={};EQUIPMENT.forEach(function(eq){m[eq.name]={name:eq.name,cat:eq.category,monthly:Array(12).fill(0)};});jobs.forEach(function(job){if(!job.start) return;const jy=parseInt(job.start.slice(0,4)),ey=job.end?parseInt(job.end.slice(0,4)):jy;if(jy>year||ey<year) return;(job.items||[]).forEach(function(it){if(!m[it.name]) return;for(let mo=0;mo<12;mo++) m[it.name].monthly[mo]+=bookedDaysInMonth(job,year,mo)*it.qty;});});return m;})()).filter(function(i){return i.monthly.some(function(v){return v>0;});}).map(function(i){const t=i.monthly.reduce(function(s,v){return s+v;},0);return ['"'+i.name+'"','"'+i.cat+'"',...i.monthly,t].join(';');});
  const blob=new Blob(['\uFEFF'+[header,...rows].join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='udstyr-statistik-'+year+'.csv'; a.click(); URL.revokeObjectURL(url);
});
['statsYear','statsCat','statsSort','statsMetric'].forEach(function(id){ document.getElementById(id).addEventListener('change', computeAndRenderStats); });
document.getElementById('showStatsBtn').addEventListener('click', function(){
  ['jobs','avail','lager','obvogne'].forEach(function(t){var el=document.getElementById('tab-'+t);if(el)el.style.display='none';});
  document.getElementById('tab-stats').style.display='block'; renderStats();
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.classList.remove('active');});
});
document.getElementById('statsCloseBtn').addEventListener('click', function(){
  document.getElementById('tab-stats').style.display='none';
  document.getElementById('tab-lager').style.display='block';
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.tab==='lager');});
});

function renderGantt(containerEl){
  const DAYS_BACK=7, DAYS_TOTAL=84, COL_W=28;
  const today=new Date(); today.setHours(0,0,0,0);
  const startDate=new Date(today); startDate.setDate(startDate.getDate()-DAYS_BACK);
  const days=[]; for(var i=0;i<DAYS_TOTAL;i++){var d=new Date(startDate);d.setDate(d.getDate()+i);days.push(d);}
  const DA_M=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const DA_D=['Sø','Ma','Ti','On','To','Fr','Lø'];
  const todayIdx=DAYS_BACK;
  const wrapper=document.createElement('div');
  wrapper.style.cssText='overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:18px;';
  const table=document.createElement('div');
  table.style.cssText='display:grid;grid-template-columns:90px repeat('+DAYS_TOTAL+','+COL_W+'px);min-width:'+(90+DAYS_TOTAL*COL_W)+'px;font-size:11px;';

  // Month header
  var corner=document.createElement('div'); corner.style.cssText='background:var(--panel-2);border-bottom:1px solid var(--border);padding:4px 0;'; table.appendChild(corner);
  var lastMonth=-1;
  days.forEach(function(d,i){
    var c=document.createElement('div');
    c.style.cssText='border-bottom:1px solid var(--border);border-left:1px solid '+(i===todayIdx?'var(--amber)':'var(--border)')+';text-align:center;padding:2px 0;background:var(--panel-2);font-family:var(--mono);color:'+(i===todayIdx?'var(--amber)':'var(--muted)')+';font-size:9.5px;font-weight:'+(d.getMonth()!==lastMonth?700:400)+';';
    if(d.getMonth()!==lastMonth){c.textContent=DA_M[d.getMonth()];lastMonth=d.getMonth();}
    table.appendChild(c);
  });

  // Day header
  var dCorner=document.createElement('div'); dCorner.style.cssText='background:var(--panel-2);border-bottom:1px solid var(--border);padding:3px 6px;color:var(--muted);font-family:var(--mono);'; dCorner.textContent='Vogn'; table.appendChild(dCorner);
  days.forEach(function(d,i){
    var isWE=d.getDay()===0||d.getDay()===6, isT=i===todayIdx;
    var c=document.createElement('div');
    c.style.cssText='border-bottom:2px solid '+(isT?'var(--amber)':'var(--border)')+';border-left:1px solid '+(isT?'var(--amber)':'var(--border)')+';text-align:center;padding:2px 0;background:'+(isT?'rgba(232,163,61,.08)':isWE?'rgba(255,255,255,.02)':'var(--panel-2)')+';font-family:var(--mono);color:'+(isT?'var(--amber)':isWE?'#6b6f7a':'var(--muted)')+';font-size:9.5px;';
    c.textContent=d.getDate()+' '+DA_D[d.getDay()]; table.appendChild(c);
  });

  // Rows
  OB_VOGNE.forEach(function(vogn,ri){
    var isLast=ri===OB_VOGNE.length-1;
    var border=isLast?'none':'1px solid var(--border)';
    var lc=document.createElement('div');
    lc.style.cssText='padding:8px 10px;border-bottom:'+border+';display:flex;align-items:center;gap:7px;background:var(--panel);';
    var dot=document.createElement('span'); dot.style.cssText='width:9px;height:9px;border-radius:50%;background:'+vogn.color+';flex-shrink:0;box-shadow:0 0 5px '+vogn.color+'88;'; lc.appendChild(dot);
    var nm=document.createElement('span'); nm.style.cssText='font-weight:700;font-size:12px;'; nm.textContent=vogn.name; lc.appendChild(nm);
    table.appendChild(lc);

    var vb=OB_BOOKINGER.filter(function(b){return b.ob_vogn_id===vogn.id;});
    var dayMap={};
    vb.forEach(function(b){
      var bs=new Date(b.start_date+'T00:00:00'),be=new Date(b.end_date+'T00:00:00'),cur=new Date(bs);
      while(cur<=be){dayMap[cur.toISOString().slice(0,10)]=b;cur.setDate(cur.getDate()+1);}
    });

    var i=0;
    while(i<DAYS_TOTAL){
      var d=days[i],iso=d.toISOString().slice(0,10),isT=i===todayIdx,isWE=d.getDay()===0||d.getDay()===6,booking=dayMap[iso];
      if(booking){
        var span=0;
        while(i+span<DAYS_TOTAL&&days[i+span].toISOString().slice(0,10)>=booking.start_date&&days[i+span].toISOString().slice(0,10)<=booking.end_date) span++;
        var isTilbud=booking.status==='tilbud';
        var color=isTilbud?'#e8a33d':'#5fb88a',bg=isTilbud?'rgba(232,163,61,.18)':'rgba(95,184,138,.18)';
        var block=document.createElement('div');
        block.style.cssText='grid-column:span '+span+';border-bottom:'+border+';background:'+bg+';border-left:3px solid '+color+';padding:3px 5px;display:flex;align-items:center;cursor:pointer;overflow:hidden;';
        block.title=(isTilbud?'TILBUD: ':'')+booking.name+(booking.who?' ('+booking.who+')':'')+'\n'+fmtDate(booking.start_date)+' → '+fmtDate(booking.end_date);
        var lbl=document.createElement('span'); lbl.style.cssText='font-size:10px;font-weight:700;color:'+color+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;';
        lbl.textContent=(isTilbud?'◐ ':'● ')+booking.name; block.appendChild(lbl);
        (function(v,b){ block.addEventListener('click',function(){openObModal(v.id,b);}); })(vogn,booking);
        table.appendChild(block); i+=Math.max(span,1);
      } else {
        var c=document.createElement('div');
        c.style.cssText='border-bottom:'+border+';border-left:1px solid '+(isT?'var(--amber)':'var(--border)')+';background:'+(isT?'rgba(232,163,61,.04)':isWE?'rgba(255,255,255,.01)':'transparent')+';';
        table.appendChild(c); i++;
      }
    }
  });

  wrapper.appendChild(table);
  var legend=document.createElement('div');
  legend.style.cssText='display:flex;gap:16px;padding:8px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);';
  legend.innerHTML='<span style="color:#5fb88a;">● Ordre</span><span style="color:#e8a33d;">◐ Tilbud</span><span>Klik på blok for at redigere</span>';
  wrapper.appendChild(legend);
  containerEl.appendChild(wrapper);
}
